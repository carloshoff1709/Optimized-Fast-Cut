/* ---------- projetos (local ou na nuvem, conforme login) ---------- */
function getProjects(){ return lsGet('projects', []); }
async function saveProject(asNew){
  const snap = JSON.parse(JSON.stringify(S)); snap.materialSnap = curMat() ? Object.assign({}, curMat()) : null;
  if (asNew || !S.id){ S.id = uid(); snap.id = S.id; }
  snap.updated = Date.now();
  if (cloudSignedIn()){
    try { await cloudSaveProject(snap); lsSet('draft', S); toast('Projeto salvo na nuvem: ' + S.name); return; }
    catch (e){ toast('Falha ao salvar na nuvem (' + e.message + '). Salvando localmente.'); }
  }
  const list = getProjects();
  const i = list.findIndex(p => p.id === S.id);
  if (i >= 0) list[i] = snap; else list.push(snap);
  if (!lsSet('projects', list)){ toast('Não foi possível salvar: o navegador bloqueou o armazenamento local.'); return; }
  lsSet('draft', S); toast('Projeto salvo: ' + S.name);
}
function applyLoadedProject(p){
  const st = JSON.parse(JSON.stringify(p)); delete st.updated; delete st.updatedBy;
  if (st.materialSnap && !materials.find(m => m.id === st.materialSnap.id)){ materials.push(st.materialSnap); lsSet('materials', materials); }
  delete st.materialSnap;
  st.params = Object.assign(defaultState().params, st.params || {}); normClad(st);
  st.walls.forEach(w => w.openings.forEach(o => { if (!(o.margin >= 0)) o.margin = 10; }));
  S = st; if (!S.walls.length) S.walls = [newWall('P01', 3000, 3000)]; S.activeWall = S.walls[0].id; UI.wallId = S.activeWall;
  syncAll(); saveDraft(); toast('Projeto aberto: ' + S.name);
}
function loadProject(id){ const p = getProjects().find(x => x.id === id); if (!p) return; applyLoadedProject(p); }
function duplicateProject(id){
  const list = getProjects(), p = list.find(x => x.id === id); if (!p) return;
  const c = JSON.parse(JSON.stringify(p)); c.id = uid(); c.name = p.name + ' (cópia)'; c.updated = Date.now();
  c.walls.forEach(w => { w.id = uid(); w.openings.forEach(o => o.id = uid()); }); c.activeWall = c.walls[0].id;
  list.push(c); lsSet('projects', list);
}
function renderProjectsList(list, cloud){
  openModal(`<div class="modal-h"><h2>Projetos${cloud ? ' <small style="font-weight:400;color:var(--muted);font-size:13px">· nuvem</small>' : ''}</h2><button class="icon-btn" data-pj="close" aria-label="Fechar">✕</button></div>
    ${list.length ? list.map(p => `<div class="proj-row"><div class="i"><b>${esc(p.name)}</b><small>${p.walls.length} parede(s): ${esc(p.walls.slice(0, 5).map(w => w.name).join(', '))}${p.walls.length > 5 ? '…' : ''} · ${esc((p.materialSnap || {}).name || '')} · ${new Date(p.updated).toLocaleString('pt-BR')}${cloud && p.updatedBy ? ' · ' + esc(p.updatedBy) : ''}</small></div>
      <button class="btn sm" data-pj="open" data-id="${p.id}" data-cloud="${cloud ? 1 : 0}">Abrir</button><button class="btn ghost sm" data-pj="dup" data-id="${p.id}" data-cloud="${cloud ? 1 : 0}">Duplicar</button><button class="btn danger sm" data-pj="del" data-id="${p.id}" data-cloud="${cloud ? 1 : 0}">Excluir</button></div>`).join('') : '<p class="empty">Nenhum projeto salvo ainda. Use "Salvar" para guardar o projeto atual.</p>'}
    <div class="modal-actions"><button class="btn" data-pj="new">Novo projeto</button><button class="btn ghost" data-pj="saveas">Salvar cópia do atual</button><button class="btn ghost" data-pj="close" style="margin-left:auto">Fechar</button></div>`);
}
async function openProjects(){
  if (cloudConfigured() && !cloudSignedIn()){ showLoginGate(); return; }
  if (cloudSignedIn()){
    openModal(`<div class="modal-h"><h2>Projetos</h2><button class="icon-btn" data-pj="close" aria-label="Fechar">✕</button></div><p class="empty"><span class="spin"></span> Carregando da nuvem…</p>`);
    try { const list = (await cloudListProjects()).sort((a, b) => b.updated - a.updated); renderProjectsList(list, true); }
    catch (e){ openModal(`<div class="modal-h"><h2>Projetos</h2><button class="icon-btn" data-pj="close" aria-label="Fechar">✕</button></div><p class="note err">Não foi possível carregar a planilha (${esc(e.message)}).</p><div class="modal-actions"><button class="btn ghost" data-pj="close">Fechar</button></div>`); }
    return;
  }
  renderProjectsList(getProjects().sort((a, b) => b.updated - a.updated), false);
}
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-pj]'); if (!b) return; const id = b.dataset.id; const cloud = b.dataset.cloud === '1';
  switch (b.dataset.pj){
    case 'close': closeModal(); break;
    case 'open':
      if (cloud){
        b.disabled = true;
        try { const list = await cloudListProjects(); const p = list.find(x => x.id === id); if (p) applyLoadedProject(p); closeModal(); }
        catch (err){ toast('Erro ao abrir: ' + err.message); b.disabled = false; }
      } else { loadProject(id); closeModal(); }
      break;
    case 'dup':
      if (cloud){
        b.disabled = true;
        try { await cloudDuplicateProject(id); toast('Projeto duplicado.'); openProjects(); }
        catch (err){ toast('Erro ao duplicar: ' + err.message); b.disabled = false; }
      } else { duplicateProject(id); openProjects(); toast('Projeto duplicado.'); }
      break;
    case 'del':
      if (!b.classList.contains('armed')){ b.classList.add('armed'); b.textContent = 'Confirmar?'; setTimeout(() => { b.classList.remove('armed'); b.textContent = 'Excluir'; }, 2500); return; }
      if (cloud){
        b.disabled = true;
        try { await cloudDeleteProject(id); openProjects(); }
        catch (err){ toast('Erro ao excluir: ' + err.message); b.disabled = false; }
      } else { lsSet('projects', getProjects().filter(p => p.id !== id)); if (S.id === id) S.id = null; openProjects(); }
      break;
    case 'new': { const keepUnit = S.unit; S = defaultState(); S.unit = keepUnit; S.materialId = materials[0].id; UI.wallId = S.activeWall; syncAll(); saveDraft(); closeModal(); toast('Novo projeto criado.'); break; }
    case 'saveas': await saveProject(true); openProjects(); break;
  }
});
function syncAll(){ $('#projName').value = S.name; renderInputs(); recalc(); }

async function saveFile(filename, data){
  let dl = null;
  try { if (window.claude && window.claude.use) dl = await window.claude.use('downloads'); } catch (e){ dl = null; }
  if (dl){
    try { await dl.save({ filename, data }); toast('Arquivo pronto: ' + filename); }
    catch (err){ if (!err || err.code !== 'declined') toast('Não foi possível salvar o arquivo (' + ((err && err.code) || 'erro') + ').'); }
    return;
  }
  const blob = data instanceof Blob ? data : new Blob([data]);
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

    .concat(cl.map(g => [g.qty, nf(g.w), nf(g.h), g.shape || 'Retangular', Array.from(g.sheets).sort((a, b) => a - b).join(' '), Array.from(g.walls).join(' ')]));

const FONT_GRID_W = 6.4, FONT_GRID_H = 10, FONT_ADV = 7.0, FONT_SPACE = 4.3;
function glyphStrokes(ch){ return FONT_GLYPHS[ch] || []; }
function normalizeEngraveText(text){
  // normaliza acentos (NFD separa a letra base da marca de acento) e descarta qualquer caractere fora
  // do ASCII puro (código acima de 0x7F) — assim a marca de acento (que vira um caractere à parte)
  // some, sem depender de citar o intervalo Unicode dela por escrito no código-fonte.
  return String(text || '').normalize('NFD').replace(/[^\x00-\x7f]/g, '').toUpperCase()
    .replace(/[^A-Z0-9 .\-]/g, ' ').replace(/\s+/g, ' ').trim();
}
function glyphOrigins(text){
  let cursor = 0; const origins = []; const chars = Array.from(text);
  chars.forEach(ch => { if (ch === ' '){ cursor += FONT_SPACE; return; } origins.push({ ch, x: cursor }); cursor += FONT_ADV; });
  const trail = chars.length && chars[chars.length - 1] === ' ' ? FONT_SPACE : (origins.length ? FONT_ADV - FONT_GRID_W : 0);
  return { origins, widthUnits: Math.max(0, cursor - trail) };
}
const ENGRAVE_MARGIN = 6;
// Gera as polilinhas de gravação (em coordenadas LOCAIS da peça, mesmo espaço de sheet.cutLines/
// pl.x,y,w,h — Y para cima) para gravar `text` centralizado na peça `pl`, numa altura FIXA de
// `heightMM` (não reduz para caber — se não couber na peça com a margem, desiste e não grava nada
// nela). Gira o texto 90° quando a peça é mais alta que larga (tira estreita), para acompanhar o lado
// maior. Cada polilinha devolvida já é um traço contínuo (ver comentário da fonte acima).
//
// `mirrorFix`: quando a chapa precisa ser usada "deitada" na mesa (T de sheetAxes), mpt() troca os
// eixos — (x,y) vira (y,x) — para que a menor medida da chapa fique no X da máquina. Essa troca de
// eixos é um ESPELHAMENTO (determinante negativo), não uma rotação: para linhas de corte isso não
// importa (um segmento reto fica igual, só muda de posição), mas para o TEXTO da gravação isso
// inverte a letra (fica de trás para frente, como visto no espelho). Para uma peça/caractere sem
// essa inversão não importa a ordem dos pontos, mas quando `mirrorFix` é true, espelhamos aqui o
// deslocamento local em X ANTES de devolver os pontos — assim, quando mpt() aplicar sua própria
// troca de eixos lá fora, as duas inversões se cancelam e o resultado final é uma ROTAÇÃO (texto
// gira com a peça, mas continua legível), em vez de um espelhamento.
function pieceEngraveCuts(pl, text, heightMM, mirrorFix){
  const raw = normalizeEngraveText(text);
  if (!raw) return [];
  const { origins, widthUnits } = glyphOrigins(raw);
  if (!origins.length || widthUnits <= 0) return [];
  const H = heightMM > 0 ? heightMM : 100;
  const rotate = pl.h > pl.w;
  const availW = (rotate ? pl.h : pl.w) - 2 * ENGRAVE_MARGIN, availH = (rotate ? pl.w : pl.h) - 2 * ENGRAVE_MARGIN;
  const s = H / FONT_GRID_H;
  if (availW <= 0 || availH <= 0 || H > availH || widthUnits * s > availW) return [];
  const startX = -(widthUnits * s) / 2, cx = pl.x + pl.w / 2, cy = pl.y + pl.h / 2, paths = [];
  origins.forEach(({ ch, x }) => {
    glyphStrokes(ch).forEach(stroke => {
      const pts = stroke.map(([gx, gy]) => {
        let px = startX + (x + gx) * s, py = (gy - FONT_GRID_H / 2) * s;
        if (rotate){ const t = px; px = -py; py = t; }
        if (mirrorFix) px = -px;
        return { x: cx + px, y: cy + py };
      });
      if (pts.length >= 2) paths.push(pts);
    });
  });
  return paths;
}

/* ---------- refilo da chapa bruta (opcional, por material) ----------
   Quando o material tem uma dimensão útil de refilo cadastrada (mat.trimW e/ou mat.trimH, no banco
   de materiais) menor que a bruta, solve() já encaixa as peças nessa dimensão útil (ver mais acima:
   "a chapa JÁ É a dimensão útil" dali em diante). Aqui só falta, no programa de usinagem, fresar a
   chapa BRUTA/física até sobrar essa dimensão útil — ANTES dos cortes das peças, nas MESMAS
   configurações de corte (mesmo passe a passe, mesmo avanço) — por isso ainda é preciso saber até
   onde a chapa física realmente se estende. */
// Dimensão BRUTA da chapa (sem o refilo), na mesma convenção "largura/altura da chapa na parede"
// usada por solve() — para o programa de usinagem saber até onde estender o(s) corte(s) de refilo.
function rawSheetDims(mat, orient){
  const Lg = Math.max(mat.w, mat.h), Sd = Math.min(mat.w, mat.h);
  return { sw: orient === 'standing' ? Sd : Lg, sh: orient === 'standing' ? Lg : Sd };
}
// Corte(s) reto(s) do refilo, já no referencial da máquina — um por eixo, só quando houver sobra real
// a remover naquele eixo (até 2 cortes no total). usefulW/usefulH = dimensão útil (já é o W,H de
// sheetAxes(), pois a paginação já usa essa dimensão); rawW/rawH = dimensão bruta/física (de
// rawSheetDims(), convertida para o eixo X/Y da máquina do mesmo jeito que sheetAxes() faz).
function trimCutLines(usefulW, usefulH, rawW, rawH){
  const cuts = [];
  if (usefulW < rawW - 0.05) cuts.push({ x1: usefulW, y1: 0, x2: usefulW, y2: rawH });
  if (usefulH < rawH - 0.05) cuts.push({ x1: 0, y1: usefulH, x2: rawW, y2: usefulH });
  return cuts;
}

/* ---------- programa de usinagem CNC (G-code, no dialeto do arquivo Corte_1 fornecido) ----------
   Cada linha de corte (sheet.cutLines, já no centro do rasgo da fresa) vira um percurso reto
   independente: aproxima em rápido, mergulha, corta em avanço e recua — repetido a cada passe até
   a profundidade total (espessura da chapa + sobre-corte). O eixo Y é o mesmo do desenho na tela
   (0 no canto inferior esquerdo da chapa), então o desenho "Plano de corte" é a referência de como
   encostar a chapa na mesa. Percursos independentes (sem encadear vértices) são mais simples e mais
   fáceis de conferir, ao custo de mais subidas/descidas do que um contorno único por peça. */
function validateCnc(P, mat){
  const e = [];
  if (!mat || !(mat.t > 0)) e.push('material sem espessura definida');
  if (!(P.cncOvercut >= 0)) e.push('sobre-corte inválido');
  if (!(P.cncPasses >= 1)) e.push('número de passes deve ser 1 ou mais');
  if (!(P.cncRpm > 0)) e.push('rotação do fuso deve ser maior que zero');
  if (!(P.cncFeed > 0)) e.push('avanço de corte deve ser maior que zero');
  if (!(P.cncPlunge > 0)) e.push('avanço de mergulho deve ser maior que zero');
  if (!(P.cncSafeZ > 0)) e.push('altura de segurança deve ser maior que zero');
  if (!(P.cncHomeZ > 0)) e.push('altura inicial/final deve ser maior que zero');
  if (!(P.cncTool >= 1)) e.push('número da ferramenta inválido');
  if (P.cncEngrave){
    if (!(P.cncEngraveDepth > 0)) e.push('profundidade de gravação deve ser maior que zero');
    if (!(P.cncEngraveFeed > 0)) e.push('avanço de gravação deve ser maior que zero');
    if (!(P.cncEngraveHeight > 0)) e.push('altura de gravação deve ser maior que zero');
  }
  if (mat){
    const w = Math.min(mat.w, mat.h), h = Math.max(mat.w, mat.h);
    if (P.cncTableX > 0 && w > P.cncTableX + 0.01) e.push(`a chapa (${mm(w)} mm no eixo X) é maior que o eixo X da mesa (${mm(P.cncTableX)} mm)`);
    if (P.cncTableY > 0 && h > P.cncTableY + 0.01) e.push(`a chapa (${mm(h)} mm no eixo Y) é maior que o eixo Y da mesa (${mm(P.cncTableY)} mm)`);
  }
  return e;
}
function gcNum(n){ let v = Math.round(n * 1000) / 1000; if (Math.abs(v) < 0.0005) v = 0; return v.toFixed(3); }
function gcFeed(n){ return (Math.round(n * 10) / 10).toFixed(1); }
// Sanitiza texto livre (nome do projeto, da chapa, da ferramenta, da peça...) antes de colocar dentro
// de um comentário G-code "(...)": remove acentos (evita byte não-ASCII no arquivo) e remove parênteses
// literais, porque um comentário "(...)" no G-code NÃO é aninhado — ele termina no primeiro ")" que
// aparecer, então qualquer "(" ou ")" dentro do texto fecha o comentário antes da hora e deixa o resto
// da linha como lixo que a máquina não consegue interpretar (programa "carrega" mas não roda nada).
function gcText(s){
  return String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[()]/g, '').replace(/[^\x20-\x7e]/g, '');
}
// Monta a sequência de "traços" (grupos de pontos que a fresa percorre num mergulho só, sem subir no
// meio) que o programa de usinagem executa, na ORDEM exata em que vão ser gravados: primeiro a
// gravação do nome de cada peça (se houver), depois cada passe de corte, passe a passe, cada um
// percorrendo as MESMAS correntes emendadas (ver chainCuts) só mudando a profundidade Z.
// Isolada em função própria porque é usada tanto para gerar o TEXTO do G-code (gcodeProgram) quanto
// para a SIMULAÇÃO visual (buildSimMoves) — as duas sempre leem exatamente a mesma lista, então nunca
// podem ficar diferentes uma da outra.
function buildStrokes(orderedCuts, passes, step, P, engravePaths){
  const strokes = [];
  if (engravePaths && engravePaths.length) engravePaths.forEach(path => { if (path && path.length >= 2) strokes.push({ phase: 'engrave', z: -P.cncEngraveDepth, feed: P.cncEngraveFeed, pts: path }); });
  const chains = chainCuts(orderedCuts);
  for (let p = 1; p <= passes; p++) chains.forEach(ch => strokes.push({ phase: 'pass' + p, pass: p, z: -(step * p), feed: P.cncFeed, pts: ch }));
  return strokes;
}
function gcodeProgram(headerLines, strokes, P){
  let n = 30; const L = []; const tool = Math.round(P.cncTool);
  const N = () => { const s = 'N' + n; n += 10; return s; };
  let first = true;
  // Percorre UMA polilinha (traço de letra OU corrente de cortes emendados ponta-a-ponta) sem subir no
  // meio: aproxima, mergulha uma vez no primeiro ponto, corta em avanço direto por todos os pontos
  // seguintes (sem recuar entre eles) e só recua no fim do percurso — usado tanto para a gravação do
  // nome da peça quanto para os cortes de verdade (ver chainCuts), passe a passe.
  const emitPath = (pts, z, feedCut) => {
    if (!pts || pts.length < 2) return;
    const p0 = pts[0];
    if (first){ L.push(N() + 'G00X' + gcNum(p0.x) + 'Y' + gcNum(p0.y)); first = false; }
    L.push(N() + 'G00X' + gcNum(p0.x) + 'Y' + gcNum(p0.y) + 'Z' + gcNum(P.cncSafeZ));
    L.push(N() + 'G1X' + gcNum(p0.x) + 'Y' + gcNum(p0.y) + 'Z' + gcNum(z) + 'F' + gcFeed(P.cncPlunge));
    for (let i = 1; i < pts.length; i++) L.push(N() + 'G1X' + gcNum(pts[i].x) + 'Y' + gcNum(pts[i].y) + 'Z' + gcNum(z) + 'F' + gcFeed(feedCut));
    const pl = pts[pts.length - 1];
    L.push(N() + 'G00X' + gcNum(pl.x) + 'Y' + gcNum(pl.y) + 'Z' + gcNum(P.cncSafeZ));
  };
  headerLines.forEach(h => L.push(h));
  L.push(N() + 'G00G21G17G90G40G49G80');
  L.push(N() + 'T' + tool + 'M06');
  L.push(N() + 'G00G43Z' + gcNum(P.cncHomeZ) + 'H' + tool);
  L.push(N() + 'G00X0.000Y0.000');
  L.push(N() + 'S' + Math.round(P.cncRpm) + 'M03');
  strokes.forEach(s => emitPath(s.pts, s.z, s.feed));
  L.push(N() + 'G00Z' + gcNum(P.cncHomeZ));
  L.push(N() + 'G00X0.000Y0.000');
  L.push(N() + 'M09');
  L.push(N() + 'M30');
  L.push('%');
  return L.join('\r\n') + '\r\n';
}
// Ordena os cortes da base (Y menor) para o topo, na mesma altura da esquerda para a direita — a
// chapa/sobra fica presa/apoiada na base o máximo de tempo possível durante o programa.
function orderCuts(cuts, mpt){
  return cuts.map(c => { const [x1, y1] = mpt(c.x1, c.y1), [x2, y2] = mpt(c.x2, c.y2); return { x1, y1, x2, y2 }; })
    .sort((a, b) => (Math.min(a.y1, a.y2) - Math.min(b.y1, b.y2)) || (Math.min(a.x1, a.x2) - Math.min(b.x1, b.x2)));
}
// Mesma ideia, mas para as polilinhas da gravação: transforma cada ponto para o espaço da máquina e
// ordena as POLILINHAS entre si (nunca os pontos dentro de uma polilinha, que têm que manter a ordem
// do traço da letra).
function orderPaths(paths, mpt){
  return paths.map(pts => pts.map(p => { const [x, y] = mpt(p.x, p.y); return { x, y }; }))
    .sort((a, b) => (Math.min(...a.map(p => p.y)) - Math.min(...b.map(p => p.y))) || (Math.min(...a.map(p => p.x)) - Math.min(...b.map(p => p.x))));
}
// Encadeia os segmentos de corte (já em coordenadas de máquina, vindos de orderCuts) que se tocam
// ponta-a-ponta num único percurso contínuo, para a fresa não subir/reaproximar entre eles — só o faz
// quando o ponto atual realmente não tem mais nenhum corte sem usar emendando ali (ex.: um cruzamento
// em T, onde sobra um terceiro braço que vira o início de outra corrente).
// Cada corte é usado em UMA corrente só. A corrente parte do corte de maior prioridade ainda livre
// (mesma ordem de orderCuts: base->topo, esquerda->direita) e cresce para os dois lados enquanto
// houver emenda; quando há mais de uma emenda possível no mesmo ponto, prefere a que segue mais reto
// (menor desvio em relação à direção de chegada) para evitar ziguezague sem necessidade.
// Antes de emendar, separa() quebra em dois qualquer corte que receba, no meio do seu próprio traçado
// (não na ponta), a ponta de outro corte perpendicular — um cruzamento em T real, comum quando um
// corte comprido (de uma chapa com várias peças) atravessa por onde outro corte termina. Sem isso,
// esse encontro no meio passaria batido: as duas pontas não "bateriam" uma na outra.
function splitAtJunctions(cuts, EPS){
  const isHoriz = c => Math.abs(c.y1 - c.y2) < EPS, isVert = c => Math.abs(c.x1 - c.x2) < EPS;
  const cutPoints = cuts.map(() => new Set());
  cuts.forEach((a, i) => [[a.x1, a.y1], [a.x2, a.y2]].forEach(([px, py]) => {
    cuts.forEach((b, j) => {
      if (i === j) return;
      if (isHoriz(b) && Math.abs(py - b.y1) < EPS){
        const xmin = Math.min(b.x1, b.x2), xmax = Math.max(b.x1, b.x2);
        if (px > xmin + EPS && px < xmax - EPS) cutPoints[j].add(px);
      } else if (isVert(b) && Math.abs(px - b.x1) < EPS){
        const ymin = Math.min(b.y1, b.y2), ymax = Math.max(b.y1, b.y2);
        if (py > ymin + EPS && py < ymax - EPS) cutPoints[j].add(py);
      }
    });
  }));
  const out = [];
  cuts.forEach((c, j) => {
    if (!cutPoints[j].size){ out.push(c); return; }
    const horiz = isHoriz(c);
    const lo = horiz ? Math.min(c.x1, c.x2) : Math.min(c.y1, c.y2);
    const hi = horiz ? Math.max(c.x1, c.x2) : Math.max(c.y1, c.y2);
    const fixed = horiz ? c.y1 : c.x1;
    const pts = [lo].concat(Array.from(cutPoints[j]).sort((a, b) => a - b), [hi]);
    for (let k = 0; k < pts.length - 1; k++){
      const a = pts[k], b = pts[k + 1];
      if (b - a < EPS) continue; // descarta micro-trecho residual do arredondamento
      out.push(horiz ? { x1: a, y1: fixed, x2: b, y2: fixed } : { x1: fixed, y1: a, x2: fixed, y2: b });
    }
  });
  return out;
}
// Faz a emenda greedy por coincidência exata de ponta (sem separar nada) numa lista de cortes já em
// coordenadas de máquina. Isolado em função própria porque chainCuts roda isto duas vezes — uma vez
// direto nos cortes originais, outra nos cortes já separados pelo splitAtJunctions — para poder
// comparar o resultado e escolher o que tem menos subidas (ver chainCuts).
function buildChains(cuts, EPS){
  const key = (x, y) => Math.round(x / EPS) + '_' + Math.round(y / EPS);
  const used = cuts.map(() => false);
  const byPoint = new Map();
  const addPt = (x, y, idx, end) => { const k = key(x, y); if (!byPoint.has(k)) byPoint.set(k, []); byPoint.get(k).push({ idx, end }); };
  cuts.forEach((c, idx) => { addPt(c.x1, c.y1, idx, 0); addPt(c.x2, c.y2, idx, 1); });
  const pt = (idx, end) => end === 0 ? { x: cuts[idx].x1, y: cuts[idx].y1 } : { x: cuts[idx].x2, y: cuts[idx].y2 };
  const otherEnd = end => end === 0 ? 1 : 0;
  const pickNext = (x, y, dirX, dirY) => {
    const cands = (byPoint.get(key(x, y)) || []).filter(e => !used[e.idx]);
    if (!cands.length) return null;
    if (cands.length === 1) return cands[0];
    let best = cands[0], bestScore = -Infinity;
    cands.forEach(c => {
      const p = pt(c.idx, otherEnd(c.end));
      const vx = p.x - x, vy = p.y - y, len = Math.hypot(vx, vy) || 1;
      const score = (vx / len) * dirX + (vy / len) * dirY; // 1 = segue reto, -1 = inverte
      if (score > bestScore + 1e-9) { bestScore = score; best = c; }
    });
    return best;
  };
  const order = cuts.map((_, idx) => idx).sort((a, b) => {
    const ca = cuts[a], cb = cuts[b];
    return (Math.min(ca.y1, ca.y2) - Math.min(cb.y1, cb.y2)) || (Math.min(ca.x1, ca.x2) - Math.min(cb.x1, cb.x2));
  });
  const chains = [];
  order.forEach(startIdx => {
    if (used[startIdx]) return;
    used[startIdx] = true;
    const pts = [pt(startIdx, 0), pt(startIdx, 1)];
    for (;;){ // estende para a frente a partir do fim da corrente
      const a = pts[pts.length - 2], b = pts[pts.length - 1];
      const dl = Math.hypot(b.x - a.x, b.y - a.y) || 1;
      const nxt = pickNext(b.x, b.y, (b.x - a.x) / dl, (b.y - a.y) / dl);
      if (!nxt) break;
      used[nxt.idx] = true;
      pts.push(pt(nxt.idx, otherEnd(nxt.end)));
    }
    for (;;){ // estende para trás a partir do início da corrente
      const a = pts[1], b = pts[0];
      const dl = Math.hypot(b.x - a.x, b.y - a.y) || 1;
      const prv = pickNext(b.x, b.y, (b.x - a.x) / dl, (b.y - a.y) / dl);
      if (!prv) break;
      used[prv.idx] = true;
      pts.unshift(pt(prv.idx, otherEnd(prv.end)));
    }
    chains.push(pts);
  });
  return chains;
}
// Custo relativo em "linhas de G-code" de um conjunto de correntes: cada corrente tem um custo fixo de
// aproximar+mergulhar+recuar (3) mais 1 por segmento dentro dela — é exatamente esse custo (e não só o
// número de correntes) que decide, dentro de chainCuts, se vale separar um corte num cruzamento em T.
function chainsCost(chains){ return chains.reduce((s, ch) => s + (ch.length - 1) + 3, 0); }
function chainCuts(rawCuts){
  const EPS = 0.05; // mm — tolerância para considerar fim de um corte = início do próximo
  const plain = buildChains(rawCuts, EPS);
  // Separar um corte num cruzamento em T só compensa se os dois pedaços resultantes realmente emendam
  // em correntes maiores; quando só um lado emenda e o outro sobra isolado, a separação sozinha já
  // paga o preço de uma aproximação+mergulho+recuo extra sem tirar nenhuma subida de verdade — nesse
  // caso específico, cortar esse corte inteiro de uma vez (sem separar) é igual ou melhor. Por isso
  // sempre se compara o custo das duas abordagens e fica com a que tiver menos linhas/subidas.
  const split = buildChains(splitAtJunctions(rawCuts, EPS), EPS);
  return chainsCost(split) < chainsCost(plain) ? split : plain;
}
// Reúne tudo que tanto o G-code quanto a simulação visual de UMA CHAPA precisam — a mesma dimensão
// útil/bruta, os mesmos cortes (com refilo, se houver) e os mesmos traços de gravação já viram
// "strokes" (ver buildStrokes) aqui, então generateGcode e a simulação nunca podem divergir.
function sheetToolpath(sheet, r){
  const P = S.params, mat = R.mat, total = mat.t + P.cncOvercut;
  const passes = Math.max(1, Math.round(P.cncPasses || 1));
  const step = total / passes, tool = Math.round(P.cncTool);
  const { T, W, H, mpt } = sheetAxes(r); // W,H = dimensão ÚTIL (a paginação já encaixa nela, ver solve())
  const ordered = orderCuts(sheet.cutLines, mpt);
  const hasTrim = mat.trimW > 0 || mat.trimH > 0;
  let allCuts = ordered, rawW = W, rawH = H, trimmed = false;
  if (hasTrim){
    const raw = rawSheetDims(mat, r.orient);
    rawW = T ? raw.sh : raw.sw; rawH = T ? raw.sw : raw.sh;
    const trimLines = trimCutLines(W, H, rawW, rawH);
    if (trimLines.length){ allCuts = trimLines.concat(ordered); trimmed = true; }
  }
  let engrave = [];
  if (P.cncEngrave) sheet.placed.forEach(pl => { engrave = engrave.concat(orderPaths(pieceEngraveCuts(pl, pl.piece.label, P.cncEngraveHeight, T), mpt)); });
  const strokes = buildStrokes(allCuts, passes, step, P, engrave);
  return { P, mat, total, passes, step, tool, T, W, H, rawW, rawH, trimmed, strokes };
}
function generateGcode(sheet, r){
  const tp = sheetToolpath(sheet, r);
  const { P, mat, total, passes, tool, W, H, rawW, rawH, trimmed, strokes } = tp;
  const header = [
    '( ' + gcText(S.name || 'Projeto') + (P.isClad ? ' - REVESTIMENTO' : '') + ' - Chapa ' + sheet.no + ' )',
    '(######## Troca de ferramentas ########)',
    '(   NUMERO DA FERRAMENTA:' + tool + (P.cncToolName ? ' ' + gcText(P.cncToolName) : '') + ')',
    '(   MAQUINA:' + gcText(P.cncMachine || '') + ' / POS-PROCESSADOR:' + gcText(P.cncPost || '') + ')'
  ].concat(trimmed ? [
    '(   CHAPA BRUTA A CARREGAR NA MESA - eixo X:' + mm(rawW) + 'mm  eixo Y:' + mm(rawH) + 'mm  MATERIAL:' + gcText(mat.name) + ')',
    '(   REFILO: antes das pecas, fresa a chapa bruta ate a area util de ' + mm(W) + ' x ' + mm(H) + 'mm, nas mesmas configuracoes de corte - com a chapa ainda inteira)'
  ] : []).concat([
    '(   CHAPA UTIL - apos refilo, se houver - eixo X:' + mm(W) + 'mm  eixo Y:' + mm(H) + 'mm  MATERIAL:' + gcText(mat.name) + ' esp.' + fmtNum(mat.t, 1) + 'mm  PROF.TOTAL:' + fmtNum(total, 3) + 'mm em ' + passes + (passes === 1 ? ' passe)' : ' passes)'),
    '(   ORIGEM X0 Y0 = CANTO DE REFERENCIA DA CHAPA NA MESA - mesmo ponto marcado no desenho)',
    '(   ORDEM: corte inicia na base - Y menor - e avanca para o topo - Y maior)',
    '(   cada passe percorre TODOS os cortes na profundidade atual antes de aprofundar o proximo)'
  ]).concat(strokes.some(s => s.phase === 'engrave') ? [
    '(   ANTES DO CORTE: grava o nome de cada peca - altura ' + fmtNum(P.cncEngraveHeight, 0) + 'mm, prof.' + fmtNum(P.cncEngraveDepth, 2) + 'mm, tracos continuos - com a chapa ainda inteira)'
  ] : []);
  return gcodeProgram(header, strokes, P);
}
// Mesma ideia de sheetToolpath, só que para UMA peça (sobra/retalho), já deslocada pro canto próprio.
function pieceToolpath(sheet, r, pieceLabel){
  const P = S.params, mat = R.mat, total = mat.t + P.cncOvercut;
  const passes = Math.max(1, Math.round(P.cncPasses || 1));
  const step = total / passes, tool = Math.round(P.cncTool);
  const { T, mpt, mdim } = sheetAxes(r);
  const pl = sheet.placed.find(x => x.piece.label === pieceLabel);
  const [pdw, pdh] = pl ? mdim(pl.w, pl.h) : [0, 0];
  const cuts = cutsForPiece(sheet, pieceLabel, P.kerf, r.sw, r.sh);
  const ordered = orderCuts(cuts, mpt);
  const engraveM = P.cncEngrave && pl ? orderPaths(pieceEngraveCuts(pl, pieceLabel, P.cncEngraveHeight, T), mpt) : [];
  // Desloca tudo para uma origem própria (canto do material que sobra a peça, não o da chapa
  // inteira) — assim dá para usar só uma sobra menor, alinhada nesse canto, em vez da chapa toda.
  let minX = Infinity, minY = Infinity;
  const all = ordered.length ? ordered : [];
  all.forEach(c => { minX = Math.min(minX, c.x1, c.x2); minY = Math.min(minY, c.y1, c.y2); });
  if (pl){ const [px, py] = mpt(pl.x, pl.y), [px2, py2] = mpt(pl.x + pl.w, pl.y + pl.h); minX = Math.min(minX, px, px2); minY = Math.min(minY, py, py2); }
  if (!isFinite(minX)) minX = 0; if (!isFinite(minY)) minY = 0;
  const shift = c => ({ x1: c.x1 - minX, y1: c.y1 - minY, x2: c.x2 - minX, y2: c.y2 - minY });
  const shiftPt = p => ({ x: p.x - minX, y: p.y - minY });
  const shifted = ordered.map(shift);
  const engrave = engraveM.map(path => path.map(shiftPt));
  const strokes = buildStrokes(shifted, passes, step, P, engrave);
  return { P, mat, total, passes, step, tool, pdw, pdh, pl, strokes };
}
function generatePieceGcode(sheet, r, pieceLabel){
  const tp = pieceToolpath(sheet, r, pieceLabel);
  const { P, mat, total, passes, tool, pdw, pdh, pl, strokes } = tp;
  const header = [
    '( ' + gcText(S.name || 'Projeto') + (P.isClad ? ' - REVESTIMENTO' : '') + ' - Chapa ' + sheet.no + ' - Peca ' + gcText(pieceLabel) + ' )',
    '(######## Troca de ferramentas ########)',
    '(   NUMERO DA FERRAMENTA:' + tool + (P.cncToolName ? ' ' + gcText(P.cncToolName) : '') + ')',
    '(   MAQUINA:' + gcText(P.cncMachine || '') + ' / POS-PROCESSADOR:' + gcText(P.cncPost || '') + ')',

// Grava a simulação inteira num arquivo de vídeo baixável (MP4 quando o navegador sabe gravar, senão

function simDownloadVideo(){

const PDFC = { whole: [221, 184, 119], cut: [147, 199, 187], remn: [191, 227, 196], resid: [217, 223, 225], ink: [18, 38, 44], mut: [88, 108, 114], acc: [11, 92, 173], red: [179, 38, 30], line: [205, 215, 218] };
function pdfWall(doc, x, y, boxW, boxH, ent, r){
  const W = ent.wall.w, H = ent.wall.h, k = Math.min((boxW - 14) / W, (boxH - 8) / H), ox = x + 12, oy = y + 4;
  doc.setDrawColor(...PDFC.ink); doc.setLineWidth(0.3); doc.setFillColor(255, 255, 255); doc.rect(ox, oy, W * k, H * k, 'FD');
  ent.lay.pieces.forEach(p => {
    const rs = pieceRects(p);
    doc.setFillColor(...(p.whole ? PDFC.whole : PDFC.cut)); doc.setDrawColor(...PDFC.ink); doc.setLineWidth(0.15);
    if (p.body){
      rs.forEach(b => { doc.setDrawColor(...(p.whole ? PDFC.whole : PDFC.cut)); doc.rect(ox + b.x * k, oy + (H - b.y - b.h) * k, b.w * k, b.h * k, 'FD'); });
      doc.setDrawColor(...PDFC.ink); doc.setLineWidth(0.2);
      mergeCutSegs(unionOutline(rs), 0.01).forEach(c => doc.line(ox + c.x1 * k, oy + (H - c.y1) * k, ox + c.x2 * k, oy + (H - c.y2) * k));
    } else doc.rect(ox + p.x * k, oy + (H - p.y - p.h) * k, p.w * k, p.h * k, 'FD');
  });
  if (S.params.showStuds && S.params.studs > 0){
    doc.setDrawColor(...PDFC.acc); doc.setLineWidth(0.15); doc.setLineDashPattern([1.2, 1], 0);
    studAxes(W, S.params.studs, r.start).forEach(sx => doc.line(ox + sx * k, oy, ox + sx * k, oy + H * k)); doc.setLineDashPattern([], 0);
  }

    const av = avoidFor(S.params, ent.wall.id);
    if (av){
      doc.setDrawColor(200, 120, 0); doc.setLineWidth(0.3); doc.setLineDashPattern([1.6, 1.2], 0);
      av.v.forEach(o => doc.line(ox + o.x * k, oy + (H - o.y0) * k, ox + o.x * k, oy + (H - o.y1) * k));
      av.h.forEach(y => doc.line(ox, oy + (H - y) * k, ox + W * k, oy + (H - y) * k));

      if (ph > 12 && pw > 16){ doc.setFont('helvetica', 'normal'); doc.setFontSize(Math.min(6.5, pw / 4 + 1.5)); doc.text(mm(p.w) + ' x ' + mm(p.h), px + pw / 2, py + ph / 2 + 3, { align: 'center' }); }
    }
  });

    const px = ox + o.x * k, py = oy + (H - o.y - o.h) * k;
    doc.setDrawColor(...PDFC.acc); doc.setLineWidth(0.4); doc.setLineDashPattern([2, 1], 0); doc.setFillColor(255, 255, 255); doc.rect(px, py, o.w * k, o.h * k, 'FD'); doc.setLineDashPattern([], 0);
    doc.setTextColor(...PDFC.acc); doc.setFont('helvetica', 'bold'); doc.setFontSize(8); doc.text(String(o.name), px + o.w * k / 2, py + o.h * k / 2, { align: 'center' });
  });
  doc.setTextColor(...PDFC.mut); doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5);
  doc.text(mm(W) + ' mm', ox + W * k / 2, oy - 1, { align: 'center' });
  doc.text(mm(H) + ' mm', ox - 2, oy + H * k / 2, { align: 'center', angle: 90 });
  return oy + H * k;
}
function pdfSheet(doc, x, y, boxW, boxH, s, r){
  const { W, H, spt, srect } = sheetAxes(r);
  const k = Math.min(boxW / W, boxH / H);
  doc.setDrawColor(...PDFC.ink); doc.setLineWidth(0.3); doc.setFillColor(...PDFC.resid); doc.rect(x, y, W * k, H * k, 'FD');
  s.free.forEach(f => { const d = srect(f.x, f.y, f.w, f.h); doc.setFillColor(...(f.reusable ? PDFC.remn : PDFC.resid)); doc.setLineWidth(0.1); doc.setLineDashPattern([1, 1], 0); doc.rect(x + d.x * k, y + d.y * k, d.w * k, d.h * k, 'FD'); doc.setLineDashPattern([], 0);
    if (d.w * k > 14 && d.h * k > 8){ doc.setTextColor(...PDFC.ink); doc.setFont('helvetica', 'normal'); doc.setFontSize(6.5); doc.text((f.reusable ? 'Sobra ' : 'Resíduo ') + mm(d.w) + 'x' + mm(d.h), x + (d.x + d.w / 2) * k, y + (d.y + d.h / 2) * k, { align: 'center' }); } });

    doc.setFillColor(...col); doc.setLineWidth(0.2); doc.setDrawColor(...PDFC.ink);

      body.forEach(b => { const q = srect(b.x, b.y, b.w, b.h); doc.setDrawColor(...col); doc.rect(x + q.x * k, y + q.y * k, q.w * k, q.h * k, 'FD'); });
      doc.setDrawColor(...PDFC.ink); doc.setLineWidth(0.25);
      mergeCutSegs(unionOutline(body), 0.01).forEach(c => { const [x1, y1] = spt(c.x1, c.y1), [x2, y2] = spt(c.x2, c.y2); doc.line(x + x1 * k, y + y1 * k, x + x2 * k, y + y2 * k); });
    } else doc.rect(x + dbb.x * k, y + dbb.y * k, dbb.w * k, dbb.h * k, 'FD');
    const lbn = biggestRect(body), d = srect(lbn.x, lbn.y, lbn.w, lbn.h), px = x + d.x * k, py = y + d.y * k, pw = d.w * k, ph = d.h * k;
    if (pw > 12 && ph > 8){ doc.setTextColor(...PDFC.ink); doc.setFont('helvetica', 'bold'); doc.setFontSize(7); doc.text(s.kind === 'whole' && !s.trimmed ? 'Inteira' : String(pl.piece.label), px + pw / 2, py + ph / 2 - 1, { align: 'center' });

  });
  doc.setDrawColor(...PDFC.red); doc.setLineWidth(0.3); doc.setLineDashPattern([1.5, 1], 0);
  s.cutLines.forEach(c => { const [x1, y1] = spt(c.x1, c.y1), [x2, y2] = spt(c.x2, c.y2); doc.line(x + x1 * k, y + y1 * k, x + x2 * k, y + y2 * k); }); doc.setLineDashPattern([], 0);
  doc.setFillColor(...PDFC.acc); doc.circle(x, y + H * k, 0.9, 'F'); doc.setTextColor(...PDFC.acc); doc.setFont('helvetica', 'bold'); doc.setFontSize(6); doc.text('X0 Y0', x + 1.6, y + H * k - 1);
  return { w: W * k, h: H * k };
}

  // rodapé com paginação

  const fname = (S.name || 'projeto').replace(/[^\w\-]+/g, '_') + (CUR_LAYER ? '_revest' : '') + '_paginacao.pdf';
  return { fname, blob: doc.output('blob') };
}
