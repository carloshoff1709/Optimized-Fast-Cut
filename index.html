<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Optimized Fast Cut</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#E8ECEE; --panel:#FFFFFF; --panel2:#F3F6F7; --ink:#12262C; --muted:#586C72; --line:#CDD7DA;
  --accent:#0B5CAD; --accent-h:#084A8C; --on-accent:#FFFFFF; --accent-soft:#DAE8F5;
  --danger:#B3261E; --danger-soft:#FBE9E7; --ok:#2B7A4B; --warn:#8A5A00; --warn-soft:#FFF3D6;
  --whole:#DDB877; --cut:#93C7BB; --remn:#BFE3C4; --resid:#D9DFE1; --stud:#0B5CAD;
  --f-body:'Barlow','Segoe UI',system-ui,-apple-system,Arial,sans-serif;
  --f-num:'Barlow Condensed','Arial Narrow','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D191D; --panel:#152529; --panel2:#1A2E33; --ink:#E5EEF0; --muted:#94A9AF; --line:#2B4046;
    --accent:#6DB2F2; --accent-h:#8CC4F7; --on-accent:#08202F; --accent-soft:#1B3A55;
    --danger:#F2867F; --danger-soft:#3A1F1D; --ok:#6CC28D; --warn:#F0BE62; --warn-soft:#3A2E12;
    --whole:#A98546; --cut:#4B8A7E; --remn:#467F52; --resid:#38484D; --stud:#6DB2F2;
  }
}
:root[data-theme="dark"]{
  --bg:#0D191D; --panel:#152529; --panel2:#1A2E33; --ink:#E5EEF0; --muted:#94A9AF; --line:#2B4046;
  --accent:#6DB2F2; --accent-h:#8CC4F7; --on-accent:#08202F; --accent-soft:#1B3A55;
  --danger:#F2867F; --danger-soft:#3A1F1D; --ok:#6CC28D; --warn:#F0BE62; --warn-soft:#3A2E12;
  --whole:#A98546; --cut:#4B8A7E; --remn:#467F52; --resid:#38484D; --stud:#6DB2F2;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--f-body);-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-family:var(--f-num);font-weight:600;letter-spacing:.01em}
h2{font-size:21px}
h3{font-size:17px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- barra superior ---------- */
.top{display:flex;align-items:center;gap:14px;padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-num);font-weight:700;font-size:22px;white-space:nowrap}
.brand-logo{height:28px;width:auto;flex:none;display:block;margin-right:10px}
.brand-name{letter-spacing:.01em}
.brand-name b{font-weight:800}
.projname{flex:1 1 220px;min-width:0;max-width:420px;border:1px solid transparent;background:var(--panel2);border-radius:6px;padding:7px 10px;font-weight:600}
.projname:hover{border-color:var(--line)}
.top-actions{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}

/* ---------- rodapé ---------- */
.app-footer{margin-top:28px;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));text-align:center;border-top:1px solid var(--line);background:var(--panel)}
.footer-rights{font-size:12.5px;color:var(--muted)}

/* ---------- botões ---------- */
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);border-radius:6px;padding:8px 14px;font-weight:600;cursor:pointer;min-height:38px}
.btn:hover{background:var(--accent-h);border-color:var(--accent-h)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--panel2);border-color:var(--muted)}
.btn.sm{padding:4px 10px;min-height:30px;font-size:14px}
.btn.big{width:100%;min-height:50px;font-size:17px;letter-spacing:.02em}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.btn.danger.armed{background:var(--danger);color:#fff}
.icon-btn{border:1px solid transparent;background:transparent;border-radius:6px;width:30px;height:30px;cursor:pointer;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;flex:none}
.icon-btn:hover{background:var(--panel2);color:var(--ink);border-color:var(--line)}
.icon-btn.armed{background:var(--danger);color:#fff}

/* ---------- layout ---------- */
.layout{display:grid;grid-template-columns:minmax(340px,410px) minmax(0,1fr);gap:18px;padding:18px 20px 40px;max-width:1700px;margin:0 auto}
.inputs{display:flex;flex-direction:column;gap:14px;min-width:0}
.results{min-width:0;display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.card-h .step{font-family:var(--f-num);font-weight:700;color:var(--accent);margin-right:6px}
.hint{color:var(--muted);font-size:13px;margin:6px 0 0}
.sep{border:0;border-top:1px solid var(--line);margin:12px 0}

/* ---------- campos ---------- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f>span{font-size:13px;color:var(--muted);font-weight:500}
.inp{display:flex;align-items:center;border:1px solid var(--line);background:var(--panel);border-radius:6px;overflow:hidden}
.inp:focus-within{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.inp input,.inp select{border:0;background:transparent;padding:7px 9px;width:100%;min-width:0;outline:0;font-variant-numeric:tabular-nums}
.inp select{padding-right:4px}
.inp em{font-style:normal;color:var(--muted);font-size:13px;padding:0 9px 0 0;white-space:nowrap}
.inp.bad{border-color:var(--danger)}
select option{background:var(--panel);color:var(--ink)}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg label{flex:1;position:relative}
.seg input{position:absolute;opacity:0;inset:0;cursor:pointer}
.seg span{display:block;text-align:center;padding:7px 4px;font-size:14px;font-weight:500;border-right:1px solid var(--line);cursor:pointer}
.seg label:last-child span{border-right:0}
.seg input:checked+span{background:var(--accent);color:var(--on-accent);font-weight:600}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:-2px}
.check{display:flex;gap:8px;align-items:flex-start;font-size:14px;margin-top:8px}
.check input{margin-top:3px}
details.adv summary{cursor:pointer;font-weight:600;padding:2px 0}
details.adv[open] summary{margin-bottom:8px}

/* ---------- paredes e aberturas ---------- */
.wall-list{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.wall-item{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:4px 4px 4px 10px;background:var(--panel)}
.wall-item.on{border-color:var(--accent);background:var(--accent-soft)}
.wall-item .nm{flex:1;min-width:0;text-align:left;background:none;border:0;cursor:pointer;padding:4px 0}
.wall-item .nm b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wall-item .nm small{color:var(--muted)}
.op-row{border:1px solid var(--line);border-radius:6px;padding:8px;margin-bottom:8px;background:var(--panel2)}
.op-row .l1{display:grid;grid-template-columns:96px 1fr 30px;gap:6px;margin-bottom:6px}
.op-row .l2{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.op-row .f>span{font-size:12px}

/* ---------- KPIs ---------- */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0}
.kpi .k{font-size:13px;color:var(--muted);font-weight:500}
.kpi .v{font-family:var(--f-num);font-weight:700;font-size:34px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:16px;font-weight:600;color:var(--muted);margin-left:3px}
.kpi .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.kpi.main{background:var(--accent);border-color:var(--accent);color:var(--on-accent);grid-column:span 2}
.kpi.main .k,.kpi.main .s,.kpi.main .v small{color:inherit;opacity:.85}
.kpi.main .v{font-size:56px}
.note{border-radius:8px;padding:10px 14px;font-size:14px}
.note.info{background:var(--accent-soft)}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.err{background:var(--danger-soft);color:var(--danger);border:1px solid var(--danger)}
.note ul{margin:4px 0 0;padding-left:20px}
.layer-h{margin-top:22px;padding:10px 14px;border-left:5px solid var(--accent);background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:8px}
.layer-h h2{margin:0}
.layer-h .hint{margin:2px 0 0}
.note .btn{margin-left:10px}

/* ---------- abas ---------- */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;cursor:pointer;font-weight:600;color:var(--muted);white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.pane{background:var(--panel);border:1px solid var(--line);border-top:0;border-radius:0 0 8px 8px;padding:16px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:4px 12px;cursor:pointer;font-size:14px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.zoom{display:flex;align-items:center;gap:8px;margin-left:auto;font-size:14px;color:var(--muted)}
.zoom input{width:140px}
.canvas{overflow:auto;border:1px solid var(--line);border-radius:6px;background:var(--panel2);padding:6px;max-height:80vh}
.wallsvg,.sheetsvg{display:block;height:auto;max-width:none}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:14px;border:1px solid var(--ink);vertical-align:-2px;margin-right:5px;border-radius:2px}
.sheet-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.sheet-card{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--panel2)}
.sheet-card h3{font-size:16px;margin-bottom:2px}
.sheet-card p{margin:0 0 6px;font-size:13px;color:var(--muted)}
.sheet-card svg{width:100%;height:auto}
.modal.sim{max-width:1200px}
.sim-canvas{overflow:hidden;border:1px solid var(--line);border-radius:6px;background:var(--panel2);padding:6px;height:clamp(300px,56vh,620px);display:flex;align-items:center;justify-content:center}
.sim-canvas svg{display:block;width:100%;height:100%;max-width:none}
.sim-bar{display:flex;align-items:center;gap:10px}
.sim-bar+.sim-bar{margin-top:8px}
.sim-time{font-size:13px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.sim-speed label span{padding:7px 10px;font-size:13px}
#simSeek{accent-color:var(--accent)}

/* ---------- tabelas ---------- */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-weight:600;color:var(--muted);font-size:13px;background:var(--panel2)}
td.n,th.n{text-align:right}
tr.best td{background:var(--accent-soft);font-weight:600}
tr.tot td{font-weight:700;border-top:2px solid var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.bal td:first-child{color:var(--muted)}
.bal td.n{font-weight:600}
.bal tr.sub td:first-child{padding-left:26px}
.empty{color:var(--muted);text-align:center;padding:30px 10px}

/* ---------- modal / toast ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(6,18,22,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:calc(24px + env(safe-area-inset-top,0px)) 14px calc(24px + env(safe-area-inset-bottom,0px));overflow:auto}
.modal{background:var(--panel);border-radius:10px;border:1px solid var(--line);width:100%;max-width:760px;padding:18px 20px}
.modal.wide{max-width:1000px}
.modal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px}
.modal-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;z-index:80;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.mat-tbl input,.mat-tbl select{border:1px solid var(--line);background:var(--panel);border-radius:5px;padding:5px 7px;width:100%;min-width:70px}
.proj-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.proj-row .i{flex:1;min-width:180px}
.proj-row .i small{display:block;color:var(--muted)}

/* ---------- relatório ---------- */
.rep{font-size:13px}
.rep h1{font-size:26px;margin-bottom:2px}
.rep h2{font-size:18px;margin:18px 0 6px;border-bottom:2px solid var(--ink);padding-bottom:2px}
.rep .meta{color:var(--muted);margin-bottom:8px}
.rep .rsvg svg{width:100%;height:auto;max-height:520px;border:1px solid var(--line)}
.rep .sheets{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rep .sheets .sheet-card{break-inside:avoid}
.rep table{font-size:12px}
#printRoot{display:none}

@media (max-width:1100px){
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  .kpi.main{grid-column:span 3}
  .two{grid-template-columns:1fr}
}
@media (max-width:860px){
  .layout{grid-template-columns:1fr;padding:12px 12px 40px}
  .top{padding:8px 12px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi.main{grid-column:span 2}
  .kpi .v{font-size:28px}
  .kpi.main .v{font-size:48px}
  .zoom{margin-left:0}
  .rep .sheets{grid-template-columns:1fr 1fr}
}
/* ---------- nuvem / login Google ---------- */
.login-gate{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
.login-gate.hidden{display:none}
.login-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:34px 30px;max-width:380px;width:100%;text-align:center;box-shadow:0 14px 44px rgba(0,0,0,.18)}
.login-card .brand-logo{height:40px;margin:0 auto 16px;display:block}
.login-card h1{font-size:19px;margin:0 0 6px}
.login-card p.hint{margin:0 0 20px}
.login-card .msg{margin-top:14px}
.login-card .inp{margin-bottom:12px;text-align:left}
.cloud-chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);padding:0 4px;white-space:nowrap}
.cloud-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block;flex:none}
.cloud-dot.off{background:var(--muted)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-1px}
@keyframes spin{to{transform:rotate(360deg)}}
.cfg-field{margin-bottom:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  @page{size:A4;margin:12mm}
  body.printing{background:#fff;color:#000}
  body.printing .app,body.printing #modalRoot,body.printing #toast{display:none!important}
  body.printing #printRoot{display:block}
  body.printing{--ink:#12262C;--muted:#555;--line:#bbb;--panel:#fff;--panel2:#f3f3f3;--whole:#DDB877;--cut:#93C7BB;--remn:#BFE3C4;--resid:#D9DFE1;--stud:#0B5CAD;--accent-soft:#DAE8F5}
  .rep .sheets{grid-template-columns:repeat(3,1fr)}
  .gcode-btn{display:none!important}
}
</style>
</head>

<script>
'use strict';
/* =====================================================================
   PAGINAÇÃO DE CHAPAS - núcleo de cálculo + interface
   Tudo em milímetros internamente. Sem backend: dados no localStorage.
   ===================================================================== */

//#CORE-START
const EPS = 0.01;
const UNITS = { mm: 1, cm: 10, m: 1000 };

/* ---------- utilidades numéricas ---------- */
function round1(n){ return Math.round(n * 10) / 10; }
function mm(n){ return String(round1(n)).replace('.', ','); }          // 1220 | 597,5
function cmpKey(a, b){ for (let i = 0; i < a.length; i++){ if (a[i] !== b[i]) return a[i] < b[i] ? -1 : 1; } return 0; }
function mulberry(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------- cálculos básicos (funções pedidas na especificação) ---------- */
function calculateWallArea(wall){ return wall.w * wall.h; }
function calculateSheetArea(mat){ return mat.w * mat.h; }
function openingsArea(wall){ return wall.openings.reduce((s, o) => s + o.w * o.h, 0); }
function calculateUtilization(pieceArea, nominal){ return nominal > 0 ? pieceArea / nominal * 100 : 0; }
function calculateWaste(pieceArea, nominal){ return nominal > 0 ? (nominal - pieceArea) / nominal * 100 : 0; }

/* ---------- 1) divisão de um comprimento em peças ----------
   Divide [0,len] em intervalos (peças) separados por juntas de largura g.
   - size: dimensão máxima da chapa nesse sentido
   - M > 0: modulação de montantes. Cada junta CAI SOBRE O EIXO de um montante
            (eixos em axisOrigin + k*M). A peça ocupa o maior nº de módulos que cabe na chapa.
   - lead: controla a 1ª peça (usado para desencontrar juntas entre fiadas)
           M>0 -> nº de módulos da 1ª peça | M=0 -> largura da 1ª peça em mm            */
/* forb: zonas proibidas para o CENTRO de uma junta, lista de intervalos abertos [lo, hi] (mesmo sistema
   de coordenadas do trecho). Usadas para manter as juntas longe dos cantos das aberturas.           */
function inForb(j, forb){ for (let i = 0; i < forb.length; i++){ if (j > forb[i][0] + EPS && j < forb[i][1] - EPS) return forb[i]; } return null; }
function buildSpan(len, size, g, M, axisOrigin, lead, forb){
  forb = forb || [];
  const out = []; let s = 0, first = true, guard = 0;
  while (s < len - EPS && guard++ < 500){
    const remaining = len - s;
    let end, next;
    if (first && lead != null){
      let c;
      if (M > 0){ c = axisOrigin + lead * M; end = c - g / 2; next = c + g / 2; }
      else { end = s + Math.min(lead, size); c = end + g / 2; next = end + g; }
      if (end >= len - EPS){ end = len; next = len; }
      else if (inForb(c, forb)) return null;                // 1ª junta cairia perto de um canto
    } else if (remaining <= size + EPS){ end = len; next = len; }
    else if (M > 0){
      let bestB = null;
      const kStart = Math.floor((s + g / 2 - axisOrigin) / M) + 1;
      for (let k = kStart; k < kStart + 400; k++){
        const b = axisOrigin + k * M, e = b - g / 2;
        if (e - s > size + EPS) break;
        if (e - s > 1 && b < len && !inForb(b, forb)) bestB = b;   // eixo de montante só serve se não cair perto de um canto
        if (b >= len) break;
      }
      if (bestB == null) return null;                       // chapa menor que a modulação
      end = bestB - g / 2; next = bestB + g / 2;
    } else {
      end = s + size; let c = end + g / 2, f;
      for (let it = 0; it < 30 && (f = inForb(c, forb)); it++) c = f[0];   // recua a junta até a borda da zona proibida
      end = c - g / 2;
      if (forb.length && end - s < 100) return null;        // recuo deixaria uma tira estreita demais
      next = end + g;
    }
    out.push({ a: s, b: end });
    s = next; first = false;
  }
  return out;
}

/* Divide a largura da parede conforme o "sentido de início" (esquerda | direita | centro). */
function buildAxis(len, size, g, M, start, lead, forb){
  if (M > 0) g = 0;   // com montante: a junta cai no eixo do montante, a chapa NÃO é refilada (ex.: 2400 mm em módulos de 600)
  forb = forb || [];
  if (len <= size + EPS) return [{ a: 0, b: len }];
  if (start === 'left') return buildSpan(len, size, g, M, 0, lead, forb);
  if (start === 'right'){
    const r = buildSpan(len, size, g, M, 0, lead, forb.map(f => [len - f[1], len - f[0]]));
    return r && r.map(p => ({ a: len - p.b, b: len - p.a })).reverse();
  }
  // centro: junta no meio da parede, duas metades (espelhadas quando não há zonas proibidas)
  const half = (len - g) / 2;
  if (inForb(half + g / 2, forb)) return null;              // a junta central cairia perto de um canto
  const hl = buildSpan(half, size, g, M, -g / 2, lead, forb.map(f => [half - f[1], half - f[0]]));
  const hr = forb.length ? buildSpan(half, size, g, M, -g / 2, lead, forb.map(f => [f[0] - (half + g), f[1] - (half + g)])) : hl;
  if (!hl || !hr) return null;
  const left = hl.map(p => ({ a: half - p.b, b: half - p.a })).reverse();
  const right = hr.map(p => ({ a: half + g + p.a, b: half + g + p.b }));
  return left.concat(right);
}
function joints(cols){ return cols.slice(1).map((c, i) => (cols[i].b + c.a) / 2); }
function minJointDist(a, b){
  const ja = joints(a), jb = joints(b); let m = Infinity;
  ja.forEach(x => jb.forEach(y => { m = Math.min(m, Math.abs(x - y)); }));
  return m;
}
function leadOptions(size, g, M, mode){
  if (M > 0) g = 0;
  const o = [null];
  if (M > 0){
    const ao = mode === 'center' ? -g / 2 : 0;
    for (let k = 1; k < 200; k++){ const e = ao + k * M - g / 2; if (e > size + EPS) break; if (e > 1) o.push(k); }
  } else [0.5, 1 / 3, 2 / 3, 0.25, 0.75].forEach(f => o.push(Math.round(size * f / 10) * 10));
  return o;
}
function studAxes(W, M, start){
  const a = []; if (!(M > 0)) return a;
  if (start === 'center'){ const c = W / 2; for (let k = 0; c - k * M > 0.5; k++){ if (k === 0) a.push(c); else { a.push(c - k * M); a.push(c + k * M); } } return a.filter(x => x > 0.5 && x < W - 0.5).sort((x, y) => x - y); }
  for (let x = M; x < W - 0.5; x += M) a.push(start === 'right' ? W - x : x);
  return a.sort((x, y) => x - y);
}

/* ---------- 2) paginação da parede ----------
   Monta as fiadas (de baixo p/ cima) e as colunas de cada fiada.
   Se houver desencontro mínimo entre juntas, cada fiada testa vários deslocamentos
   e escolhe o que respeita a regra com menos tiras pequenas e menos peças.
   Depois subtrai as aberturas de cada célula e gera a lista de peças.                */
/* Retângulo de recorte de uma abertura, já com o recuo (margem) somado e recortado aos limites da parede. */
function openingCutRect(o, W, H){
  const m = o.margin > 0 ? o.margin : 0;
  return { x0: Math.max(0, o.x - m), x1: Math.min(W, o.x + o.w + m), y0: Math.max(0, o.y - m), y1: Math.min(H, o.y + o.h + m) };
}
/* ---------- regra técnica: juntas longe dos cantos das aberturas ----------
   Nenhuma junta (vertical ou horizontal) pode ficar a menos de D mm (padrão 200) do vértice de canto de
   uma porta/janela. A chapa que contorna o canto é cortada inteira em L (ou U / moldura), abraçando a quina.
   Cantos encostados no piso, no teto ou nas laterais da parede não contam (o vão é aberto ali).           */
function cornerPoints(wall, W, H, fg, D){
  const pts = []; if (!(D > 0)) return pts;
  wall.openings.forEach(o => {
    const c = openingCutRect(o, W, H);
    [[c.x0, c.y0], [c.x1, c.y0], [c.x0, c.y1], [c.x1, c.y1]].forEach(([x, y]) => {
      if (x <= 0.5 || x >= W - 0.5 || y <= fg + 0.5 || y >= H - 0.5) return;
      pts.push({ x, y, name: o.name });
    });
  });
  return pts;
}
/* Fiadas de baixo para cima; cada junta horizontal atravessa a parede toda, então evita a altura de
   qualquer canto (± D). Se a junta cair numa zona proibida, ela desce até a borda da zona.            */
function buildRows(H, fg, sh, gH, forbY){
  const rows = []; let s = fg, guard = 0, forced = false;
  while (s < H - EPS && guard++ < 300){
    if (H - s <= sh + EPS){ rows.push({ a: s, b: H }); break; }
    let j = s + sh + gH / 2, f;

/* Recalcula os cortes de UMA chapa já encaixada, a partir do resultado final (peças + sobras).
   Só recebe corte o limite entre um retângulo que É uma peça de verdade e qualquer vizinho — o
   limite entre duas sobras (nenhuma delas usada) não é cortado, para a sobra ficar a maior e mais
   inteira possível. Isso substitui os cortes acumulados durante a busca (que servem só para a busca
   escolher entre alternativas) pelo conjunto mínimo necessário para liberar as peças reais.        */
function mergeCutSegs(segs, EPS){
  const byLine = new Map();
  segs.forEach(s => { const key = s.orient + '|' + Math.round(s.pos * 100); if (!byLine.has(key)) byLine.set(key, []); byLine.get(key).push(s); });
  const merged = []; byLine.forEach(list => {
    list.sort((a, b) => a.a - b.a); let cur = null;
    list.forEach(s => { if (cur && s.a <= cur.b + EPS) cur.b = Math.max(cur.b, s.b); else { if (cur) merged.push(cur); cur = { orient: s.orient, pos: s.pos, a: s.a, b: s.b }; } });
    if (cur) merged.push(cur);
  });
  return merged.map(c => c.orient === 'V' ? { x1: c.pos, y1: c.a, x2: c.pos, y2: c.b } : { x1: c.a, y1: c.pos, x2: c.b, y2: c.pos });
}
/* Segmentos de corte de UMA peça: o contorno do corpo da peça afastado k/2 para fora (centro do rasgo da
   fresa/serra). Serve para retângulos e também para L, U e moldura: o corte "abraça" o canto da abertura.
   O que cai na borda da chapa não precisa ser cortado.                                                    */
function pieceCutSegs(pl, k, sw, sh){
  const e = k / 2, out = [];
  unionOutline(plBody(pl).map(r => ({ x: r.x - e, y: r.y - e, w: r.w + 2 * e, h: r.h + 2 * e }))).forEach(sg => {
    const lim = sg.orient === 'V' ? sw : sh, lim2 = sg.orient === 'V' ? sh : sw;
    if (sg.pos <= 1e-6 || sg.pos >= lim - 1e-6) return;
    const a = Math.max(0, sg.a), b = Math.min(lim2, sg.b);
    if (b - a > 0.05) out.push({ orient: sg.orient, pos: sg.pos, a, b });
  });
  return out;
}
/* Recalcula os cortes de UMA chapa já encaixada. Só recebe corte o contorno de uma peça de verdade;
   o limite entre duas sobras não é cortado, para a sobra ficar a maior e mais inteira possível.        */
function deriveCuts(sheet, k, sw, sh){
  const segs = []; sheet.placed.forEach(pl => pieceCutSegs(pl, k, sw, sh).forEach(sg => segs.push(sg)));
  const merged = mergeCutSegs(segs, 0.5);
  let kerfArea = 0;
  sheet.cutLines = merged.map(c => { kerfArea += Math.hypot(c.x2 - c.x1, c.y2 - c.y1) * k; return c; });
  sheet.cuts = sheet.cutLines.length; sheet.kerfArea = kerfArea;
}
/* Cortes necessários para soltar UMA peça específica (aproveitar uma sobra sem rodar a chapa inteira). */
function cutsForPiece(sheet, pieceLabel, k, sw, sh){
  const target = sheet.placed.find(pl => pl.piece.label === pieceLabel);
  if (!target) return [];
  return mergeCutSegs(pieceCutSegs(target, k, sw, sh), 0.5);
}
function optimizeLayout(pieces, sw, sh, kerf, allowRot, effort){
  if (!pieces.length) return [];
  const sorts = [p => p.w * p.h, p => Math.max(p.w, p.h), p => p.h, p => p.w];
  const fits = ['bssf', 'baf', 'blsf'], splits = ['H', 'V', 'sas', 'las'];
  let best = null, bestKey = null;
  const test = (list, fit, split) => {
    const r = packOnce(list.map(p => p), sw, sh, kerf, allowRot, fit, split); if (!r) return;
    const key = packKey(r); if (!best || cmpKey(key, bestKey) < 0){ best = r; bestKey = key; }
  };
  for (const so of sorts){ const list = pieces.slice().sort((a, b) => so(b) - so(a)); for (const f of fits) for (const sp of splits) test(list, f, sp); }
  const rng = mulberry(20240611);
  for (let i = 0; i < effort; i++){
    const w = pieces.map(p => ({ p, k: p.w * p.h * (0.55 + 0.9 * rng()) })).sort((a, b) => b.k - a.k).map(x => x.p);
    test(w, fits[Math.floor(rng() * 3)], splits[Math.floor(rng() * 4)]);
  }
  return best;
}

/* ---------- 4) solução completa para uma combinação (orientação + início) ---------- */
function solve(S, mat, orient, start, effort){
  const P = S.params;
  // Refilo (banco de materiais): quando o material tem uma dimensão útil cadastrada (mat.trimW/
  // trimH) menor que a bruta, a paginação passa a encaixar as peças nessa dimensão útil — o refilo
  // "traz a chapa para o tamanho que se precisa" antes de qualquer corte de peça, então daqui em
  // diante (paginação, aproveitamento, sobras, área comprada) a chapa JÁ É a dimensão útil. A
  // dimensão bruta cadastrada (mat.w × mat.h) continua guardada no material só para o programa de
  // usinagem saber até onde a chapa física se estende e gerar o(s) corte(s) de refilo antes dos
  // cortes das peças (ver rawSheetDims/trimCutLines, perto de gcodeProgram).
  const effW = mat.trimW > 0 && mat.trimW < mat.w ? mat.trimW : mat.w;
  const effH = mat.trimH > 0 && mat.trimH < mat.h ? mat.trimH : mat.h;
  const Lg = Math.max(effW, effH), Sd = Math.min(effW, effH);
  const sw = orient === 'standing' ? Sd : Lg;      // largura da chapa na parede
  const sh = orient === 'standing' ? Lg : Sd;      // altura da chapa na parede
  const entries = [];
  for (const wall of S.walls){
    const lay = calculateLayout(wall, sw, sh, P, start);
    if (lay.error) return { error: `${wall.name}: ${lay.error}` };
    entries.push({ wall, lay });
  }
  const sheets = [];
  // chapas inteiras (peça = chapa): não entram no nesting
  entries.forEach(e => e.lay.pieces.filter(p => p.whole).forEach(p => {
    const trimW = p.w < sw - 0.5, trimH = p.h < sh - 0.5, cutLines = []; let cuts = 0, kerfArea = 0;
    // aqui não há peça do outro lado (é refilo de sobra), então o rasgo cai todo fora da peça, sem invadi-la
    if (trimW){ cutLines.push({ x1: p.w + P.kerf / 2, y1: 0, x2: p.w + P.kerf / 2, y2: sh }); cuts++; kerfArea += sh * P.kerf; }
    if (trimH){ cutLines.push({ x1: 0, y1: p.h + P.kerf / 2, x2: sw, y2: p.h + P.kerf / 2 }); cuts++; kerfArea += sw * P.kerf; }
    sheets.push({ kind: 'whole', trimmed: trimW || trimH, placed: [{ x: 0, y: 0, w: p.w, h: p.h, rot: false, piece: p }], free: [], cutLines, cuts, kerfArea });
  }));
  // demais peças: nesting (compartilhando sobras entre paredes, se marcado)
  const pools = P.share ? [entries.flatMap(e => e.lay.pieces.filter(p => !p.whole))] : entries.map(e => e.lay.pieces.filter(p => !p.whole));
  for (const pool of pools){
    const packed = optimizeLayout(pool, sw, sh, P.kerf, P.rotate, effort);
    if (packed === null) return { error: 'uma peça não cabe na chapa (verifique as medidas)' };
    packed.forEach(s => { deriveCuts(s, P.kerf, sw, sh); sheets.push(Object.assign({ kind: 'cut', trimmed: false }, s)); });
  }
  sheets.forEach((s, i) => {
    s.no = i + 1;
    s.placed.sort((a, b) => a.y - b.y || a.x - b.x);
    s.placed.forEach((pl, k) => { pl.piece.sheet = s.no; pl.piece.label = s.kind === 'whole' ? String(s.no) : s.no + '.' + (k + 1); pl.piece.rot = pl.rot; });
    s.free.forEach(f => { f.reusable = Math.min(f.w, f.h) >= P.minRem; });
  });
  return { orient, start, sw, sh, entries, sheets, metrics: calculateRemnants(entries, sheets, sw, sh, P) };
}

/* ---------- 5) indicadores, sobras e resíduos ---------- */
function calculateRemnants(entries, sheets, sw, sh, P){
  const m = {};
  m.nSheets = sheets.length;
  m.nWholeClean = sheets.filter(s => s.kind === 'whole' && !s.trimmed).length;
  m.nWholeTrim = sheets.filter(s => s.kind === 'whole' && s.trimmed).length;
  m.nCutSheets = sheets.filter(s => s.kind === 'cut').length;
  m.cornerViol = entries.reduce((n, e) => n + (e.lay.cornerViol || 0), 0);   // juntas que não respeitam a distância dos cantos
  m.layerShort = Math.round(entries.reduce((n, e) => n + (e.lay.layerShort || 0), 0)); // quanto falta (mm) para o desencontro entre camadas
  m.minLayer = Math.min(...entries.map(e => e.lay.minLayer === undefined ? Infinity : e.lay.minLayer));
  m.staggerShort = Math.round(entries.reduce((n, e) => n + (e.lay.staggerShort || 0), 0)); // quanto falta (mm, somando as fiadas) para o desencontro mínimo
  m.sheetArea = sw * sh;
  m.nominal = m.nSheets * m.sheetArea;
  m.gross = entries.reduce((s, e) => s + calculateWallArea(e.wall), 0);
  m.openArea = entries.reduce((s, e) => s + openingsArea(e.wall), 0);
  m.net = m.gross - m.openArea;
  m.pieceArea = 0; sheets.forEach(s => s.placed.forEach(pl => { m.pieceArea += plArea(pl); }));
  // Áreas de folga do piso e de recuo ao redor das aberturas, por união exata de retângulos (sem contar 2x
  // quando dois recuos se sobrepõem ou quando o recuo invade a folga do piso).
  m.floorArea = 0; m.marginArea = 0;
  entries.forEach(e => {
    const W = e.wall.w, H = e.wall.h, fg = P.floorGap > 0 ? P.floorGap : 0;
    const ops = e.wall.openings.map(o => ({ x0: o.x, x1: o.x + o.w, y0: o.y, y1: o.y + o.h }));
    const cuts = e.wall.openings.map(o => openingCutRect(o, W, H));
    const above = r => ({ x0: r.x0, x1: r.x1, y0: Math.max(r.y0, fg), y1: r.y1 }), below = r => ({ x0: r.x0, x1: r.x1, y0: r.y0, y1: Math.min(r.y1, fg) });
    m.floorArea += Math.max(0, W * fg - rectsUnionArea(ops.map(below)));
    m.marginArea += Math.max(0, rectsUnionArea(cuts.map(above)) - rectsUnionArea(ops.map(above)));
  });
  m.jointArea = Math.max(0, m.net - m.floorArea - m.marginArea - m.pieceArea);
  m.waste = Math.max(0, m.nominal - m.pieceArea);
  m.util = calculateUtilization(m.pieceArea, m.nominal);
  m.wastePct = calculateWaste(m.pieceArea, m.nominal);
  m.wallOverNominal = m.nominal > 0 ? m.gross / m.nominal * 100 : 0;
  m.reusableArea = 0; m.remnants = [];
  sheets.forEach(s => s.free.forEach(f => { if (f.reusable){ m.reusableArea += f.w * f.h; m.remnants.push({ sheet: s.no, w: f.w, h: f.h }); } }));
  m.residueArea = Math.max(0, m.waste - m.reusableArea);
  m.kerfArea = sheets.reduce((s, x) => s + x.kerfArea, 0);
  m.cuts = sheets.reduce((s, x) => s + x.cuts, 0);
  m.nPieces = sheets.filter(s => s.kind === 'cut').reduce((n, s) => n + s.placed.length, 0) + m.nWholeTrim;
  return m;
}
function rankResult(r){ return [r.metrics.cornerViol, r.metrics.layerShort, r.metrics.staggerShort, r.metrics.nSheets, r.metrics.cuts, -Math.round(r.metrics.reusableArea), r.metrics.nPieces]; }

/* Lista de peças a cortar, agrupada por medida (para enviar ao corte). */
function calculateCuts(res){
  const map = new Map();
  res.sheets.forEach(sh => sh.placed.forEach(pl => {
    if (sh.kind === 'whole' && !sh.trimmed) return;
    const p = pl.piece, key = mm(p.w) + 'x' + mm(p.h) + '|' + (p.shapeDesc || '');
    if (!map.has(key)) map.set(key, { w: p.w, h: p.h, shape: p.shapeDesc || '', qty: 0, sheets: new Set(), walls: new Set() });
    const g = map.get(key); g.qty++; g.sheets.add(sh.no); g.walls.add(p.wallName);
  }));
  return Array.from(map.values()).sort((a, b) => b.w * b.h - a.w * a.h);
}

/* Testa todas as combinações orientação x início e escolhe a melhor conforme a opção do usuário. */
function optimizeAll(S, mat, effortAlt, effortFinal){
  const P = S.params, alts = [];
  for (const o of ['standing', 'lying']) for (const st of ['left', 'right', 'center']){
    alts.push({ o, st, r: solve(S, mat, o, st, effortAlt) });
  }
  const orients = P.orientation === 'auto' ? ['standing', 'lying'] : [P.orientation];
  let chosen = null;
  for (const o of orients){
    const a = alts.find(x => x.o === o && x.st === P.start);
    if (a && !a.r.error && (!chosen || cmpKey(rankResult(a.r), rankResult(chosen.r)) < 0)) chosen = a;
  }
  if (!chosen) return { error: (alts.find(a => a.r.error) || { r: { error: 'sem solução' } }).r.error, alts };
  const fin = solve(S, mat, chosen.o, chosen.st, effortFinal);
  if (!fin.error && cmpKey(rankResult(fin), rankResult(chosen.r)) <= 0){ chosen.r = fin; }
  let bestAll = null;
  alts.forEach(a => { if (!a.r.error && (!bestAll || cmpKey(rankResult(a.r), rankResult(bestAll.r)) < 0)) bestAll = a; });
  return { sel: chosen, alts, bestAll };
}

/* ---------- validações ---------- */
function validate(S, mat){
  const e = [], P = S.params;
  if (!S.walls.length) e.push('Cadastre ao menos uma parede.');
  S.walls.forEach(w => {
    const n = w.name || 'Parede';
    if (!(w.w > 0) || !(w.h > 0)) e.push(`${n}: largura e altura devem ser números maiores que zero.`);
    w.openings.forEach((o, i) => {
      const on = `${n} / ${o.name || 'Abertura ' + (i + 1)}`;
      if (!(o.w > 0) || !(o.h > 0)) e.push(`${on}: largura e altura da abertura devem ser maiores que zero.`);
      else if (!isFinite(o.margin) || o.margin < 0) e.push(`${on}: recuo das chapas deve ser um número ≥ 0.`);
      else if (!isFinite(o.x) || !isFinite(o.y) || o.x < 0 || o.y < 0) e.push(`${on}: posição X e Y devem ser números válidos (≥ 0).`);
      else if (o.x + o.w > w.w + EPS || o.y + o.h > w.h + EPS) e.push(`${on}: a abertura ultrapassa os limites da parede (${mm(w.w)} × ${mm(w.h)} mm).`);
    });
    if (P.floorGap >= w.h) e.push(`${n}: a folga do piso (${mm(P.floorGap)} mm) é maior ou igual à altura da parede.`);
    for (let i = 0; i < w.openings.length; i++) for (let j = i + 1; j < w.openings.length; j++){
      const a = w.openings[i], b = w.openings[j];
      if (a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h) e.push(`${n}: as aberturas "${a.name}" e "${b.name}" se sobrepõem.`);
    }
  });
  if (!mat) e.push('Selecione um material (chapa) cadastrado.');
  else if (!(mat.w > 0) || !(mat.h > 0)) e.push('A chapa precisa ter largura e altura maiores que zero.');
  ['gapV', 'gapH', 'kerf', 'tol', 'minRem', 'floorGap', 'cornerClear'].forEach(k => { if (!isFinite(P[k]) || P[k] < 0) e.push('Valor inválido em: ' + ({ gapV: 'junta vertical', gapH: 'junta horizontal', kerf: 'espessura da serra', tol: 'tolerância', minRem: 'sobra mínima', floorGap: 'folga do piso', cornerClear: 'distância da junta ao canto da abertura' })[k] + ' (use número ≥ 0).'); });
  if (!isFinite(P.studs) || P.studs < 0) e.push('Modulação dos montantes inválida.');
  if (!isFinite(P.stagger) || P.stagger < 0) e.push('Desencontro mínimo inválido.');
  if (P.isClad && (!isFinite(P.layerOff) || P.layerOff < 0)) e.push('Distância mínima entre as juntas do revestimento e do OSB inválida (use número ≥ 0).');
  return e;
}

/* ---------- formatação pt-BR ---------- */
function fmtNum(n, dec = 1){ if (!isFinite(n)) return '-'; return (Math.round(n * Math.pow(10, dec)) / Math.pow(10, dec)).toLocaleString('pt-BR', { minimumFractionDigits: 0, maximumFractionDigits: dec }); }
function fmtA(a2){ return fmtNum(a2 / 1e6, 2) + ' m²'; }
function fmtA4(a2){ return fmtNum(a2 / 1e6, 4) + ' m²'; }
function fmtP(p){ return fmtNum(p, 1) + '%'; }
function unitDec(u){ return u === 'm' ? 3 : u === 'cm' ? 2 : 1; }
function toDisp(mmVal, u){ if (!isFinite(mmVal)) return ''; return String(Math.round(mmVal / UNITS[u] * 1000) / 1000).replace('.', ','); }
function fmtLen(mmVal){ const u = S.unit; return fmtNum(mmVal / UNITS[u], unitDec(u)) + ' ' + u; }
function fmtDim(w, h){ const u = S.unit; return fmtNum(w / UNITS[u], unitDec(u)) + ' × ' + fmtNum(h / UNITS[u], unitDec(u)) + ' ' + u; }
// Rótulo da chapa para telas/relatórios: mostra a dimensão bruta cadastrada e, quando o material tem
// refilo configurado, deixa explícito para qual dimensão útil ela é refilada (é essa dimensão útil
// que a paginação, o aproveitamento e a área comprada passam a usar).
function matDimsLabel(mat){
  const hasTrim = mat && ((mat.trimW > 0 && mat.trimW < mat.w) || (mat.trimH > 0 && mat.trimH < mat.h));
  if (!hasTrim) return fmtDim(mat.w, mat.h);
  const effW = mat.trimW > 0 && mat.trimW < mat.w ? mat.trimW : mat.w;
  const effH = mat.trimH > 0 && mat.trimH < mat.h ? mat.trimH : mat.h;
  return fmtDim(mat.w, mat.h) + ' → refilada p/ ' + fmtDim(effW, effH);
}
/* Aceita "3000", "3 m", "300cm", "1.220", "1,22 m"... converte para mm */
function parseLen(str, defUnit){
  let s = String(str).trim().toLowerCase().replace(/\s+/g, ''); if (!s) return NaN;
  let unit = defUnit; const m = s.match(/(mm|cm|m)$/);
  if (m){ unit = m[1]; s = s.slice(0, -m[1].length); }
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  const v = Number(s); return isFinite(v) ? v * UNITS[unit] : NaN;
}

/* Executa fn com o contexto da camada escolhida: R, parâmetros e estado da tela passam a ser os do revestimento.
   Assim TODAS as telas e exportações já criadas (vista da parede, plano de corte, lista, PDF, G-code...) servem às duas camadas. */
function inLayer(i, fn){
  if (!i || !RC || RC.errors) return fn();
  const s0 = { R, P: S.params, tab: UI.tab, wid: UI.wallId, zoom: UI.zoom, ms: UI.calcMs, L: CUR_LAYER };
  R = RC; S.params = RC.P; CUR_LAYER = 1;
  UI.tab = UI.tabC; UI.wallId = UI.wallIdC; UI.zoom = UI.zoomC; UI.calcMs = UI.calcMsC;
  try { return fn(); }
  finally {
    UI.tabC = UI.tab; UI.wallIdC = UI.wallId; UI.zoomC = UI.zoom; UI.calcMsC = UI.calcMs;
    R = s0.R; S.params = s0.P; CUR_LAYER = s0.L; UI.tab = s0.tab; UI.wallId = s0.wid; UI.zoom = s0.zoom; UI.calcMs = s0.ms;
  }
}

const activeWall = () => S.walls.find(w => w.id === S.activeWall) || S.walls[0];

function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2600); }

function lenField(label, mmVal, attrs, unitKey){
  const u = unitKey === 'mm' ? 'mm' : S.unit;
  return `<label class="f"><span>${label}</span><div class="inp"><input type="text" inputmode="decimal" autocomplete="off" ${attrs} data-u="${unitKey || 'g'}" value="${esc(toDisp(mmVal, u))}"><em>${u}</em></div></label>`;
}
function staggerOptions(P){   // com montantes, o desencontro é sempre múltiplo da modulação
  const M = P.studs, mt = curMat(), maxD = mt ? Math.max(mt.w, mt.h) : 2400, o = [];
  for (let k = 1; k * M <= maxD + 0.01 && k <= 6; k++) o.push(k * M);
  return o;
}
function snapStagger(P){
  if (P.studs > 0 && P.stagger > 0){ const o = staggerOptions(P); if (o.length && !o.includes(P.stagger)){ P.stagger = o.reduce((b, v) => Math.abs(v - P.stagger) < Math.abs(b - P.stagger) ? v : b, o[0]); } P.staggerCustom = false; }
}

function renderWallList(){
  const el = $('#wallList'); if (!el) return;
  el.innerHTML = S.walls.map(w => `<div class="wall-item ${w.id === S.activeWall ? 'on' : ''}">
    <button class="nm" data-act="selWall" data-id="${w.id}"><b>${esc(w.name || 'Parede')}</b><small>${isFinite(w.w) && isFinite(w.h) ? fmtDim(w.w, w.h) : 'medidas inválidas'}${w.openings.length ? ' · ' + w.openings.length + ' abertura(s)' : ''}</small></button>
    <button class="icon-btn" title="Duplicar parede" aria-label="Duplicar parede" data-act="dupWall" data-id="${w.id}">⧉</button>
    <button class="icon-btn" title="Excluir parede" aria-label="Excluir parede" data-act="delWall" data-id="${w.id}">✕</button></div>`).join('');
}
function renderWallForm(){
  const el = $('#wallForm'); if (!el) return;
  const w = activeWall(); if (!w){ el.innerHTML = '<p class="empty">Adicione uma parede.</p>'; return; }
  el.innerHTML = `
    <label class="f" style="margin-bottom:10px"><span>Nome da parede</span><div class="inp"><input type="text" data-wall="name" value="${esc(w.name)}"></div></label>
    <div class="grid2">${lenField('Largura da parede', w.w, 'data-wall="w"')}${lenField('Altura da parede', w.h, 'data-wall="h"')}</div>
    <hr class="sep">
    <div class="card-h" style="margin-bottom:6px"><h3>Aberturas (portas e janelas)</h3><button class="btn ghost sm" data-act="addOp">+ Abertura</button></div>
    <div id="opList">${w.openings.length ? '' : '<p class="hint" style="margin:0">Nenhuma abertura. A posição Y é medida a partir do piso. O recuo é a distância entre a chapa e o vão osso (ex.: 10, 20, 30, 40 mm).</p>'}${w.openings.map(opRow).join('')}</div>`;
}
function opRow(o){
  return `<div class="op-row" data-opid="${o.id}">
    <div class="l1"><div class="inp"><select data-op="type" aria-label="Tipo">${['Porta', 'Janela', 'Outro vão'].map(t => `<option ${o.type === t ? 'selected' : ''}>${t}</option>`).join('')}</select></div>

}

/* ---------- eventos do painel ---------- */
function commitNumber(t, setter){
  const def = t.dataset.u === 'mm' ? 'mm' : S.unit;
  const v = parseLen(t.value, def);
  t.parentElement.classList.toggle('bad', !isFinite(v));
  setter(v);
  if (isFinite(v)) t.value = toDisp(v, t.dataset.u === 'mm' ? 'mm' : S.unit);
}
document.addEventListener('change', e => {
  const t = e.target; if (!t.closest('#inputs')) return;
  const w = activeWall();
  if (t.dataset.unit != null){ S.unit = t.value; renderInputs(); }
  else if (t.dataset.wall){
    if (t.dataset.wall === 'name'){ w.name = t.value.trim() || 'Parede'; }
    else commitNumber(t, v => { w[t.dataset.wall] = v; });
    renderWallList();
  } else if (t.dataset.op){
    const o = w.openings.find(x => x.id === t.closest('.op-row').dataset.opid); if (!o) return;
    const f = t.dataset.op;
    if (f === 'type' || f === 'name') o[f] = t.value; else commitNumber(t, v => { o[f] = v; });
    renderWallList();
  } else if (t.dataset.mat != null){ S.materialId = t.value; const m = curMat(); $('#matInfo').textContent = m ? `${m.type} · ${matDimsLabel(m)} · espessura ${fmtNum(m.t, 1)} mm` : ''; }
  else if (t.dataset.c){
    const k = t.dataset.c, C = S.clad, CP = C.params;
    if (k === 'on'){ C.on = t.checked; renderInputs(); }
    else if (k === 'materialId'){ C.materialId = t.value; const cm = materials.find(m => m.id === t.value), el = $('#cladMatInfo'); if (el && cm) el.textContent = `${cm.type} · ${matDimsLabel(cm)} · espessura ${fmtNum(cm.t, 1)} mm`; }
    else if (k === 'orientation' || k === 'start') CP[k] = t.value;
    else if (k === 'layerH') CP.layerH = t.checked;
    else commitNumber(t, v => { CP[k] = v; });
  }
  else if (t.dataset.p){
    const k = t.dataset.p, P = S.params;
    if (k === 'orientation' || k === 'start') P[k] = t.value;
    else if (k === 'studsMode'){ if (t.value === 'custom'){ P.studsCustom = true; if (!(P.studs > 0)) P.studs = 500; } else { P.studsCustom = false; P.studs = Number(t.value); } renderInputs(); }
    else if (k === 'staggerMode'){ if (t.value === 'custom'){ P.staggerCustom = true; if (!(P.stagger > 0)) P.stagger = 500; } else { P.staggerCustom = false; P.stagger = Number(t.value); } renderInputs(); }
    else if (k === 'showStuds') P.showStuds = t.type === 'checkbox' ? t.checked : t.value === '1';
    else if (k === 'rotate' || k === 'share') P[k] = t.checked;
    else if (k === 'cncEngrave'){ P.cncEngrave = t.checked; renderInputs(); }
    else if (k === 'cncMachine' || k === 'cncPost' || k === 'cncToolName') P[k] = t.value;
    else if (k === 'cncTool'){ const v = Math.round(Number(t.value)); if (isFinite(v) && v >= 1) P.cncTool = v; t.value = P.cncTool; }
    else if (k === 'cncPasses'){ const v = Math.round(Number(t.value)); if (isFinite(v) && v >= 1) P.cncPasses = v; t.value = P.cncPasses; }
    else if (['cncRpm', 'cncFeed', 'cncPlunge', 'cncOvercut', 'cncSafeZ', 'cncHomeZ', 'cncTableX', 'cncTableY', 'cncEngraveDepth', 'cncEngraveFeed', 'cncEngraveHeight'].includes(k)){
      // parâmetros da máquina CNC: sempre em mm/rpm/mm-min, não seguem a unidade de exibição (mm/cm/m) do projeto
      const v = Number(String(t.value).replace(',', '.'));
      t.parentElement.classList.toggle('bad', !isFinite(v) || v < 0);
      if (isFinite(v) && v >= 0){ P[k] = v; t.value = String(v).replace('.', ','); }
    }
    else commitNumber(t, v => { P[k] = v; });
  }
  saveDraft(); recalc();
});
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  const armed = () => { if (b.classList.contains('armed')) return true; b.classList.add('armed'); b.title = 'Clique de novo para confirmar'; setTimeout(() => b.classList.remove('armed'), 2500); return false; };
  switch (act){
    case 'calc': recalc(true); break;
    case 'addWall': { const w = newWall('P' + String(S.walls.length + 1).padStart(2, '0'), 3000, 3000); S.walls.push(w); S.activeWall = w.id; renderWallList(); renderWallForm(); break; }
    case 'selWall': S.activeWall = id; renderWallList(); renderWallForm(); return;
    case 'dupWall': { const w = S.walls.find(x => x.id === id), c = JSON.parse(JSON.stringify(w)); c.id = uid(); c.name = w.name + ' (cópia)'; c.openings.forEach(o => o.id = uid()); S.walls.push(c); S.activeWall = c.id; renderWallList(); renderWallForm(); break; }
    case 'delWall': if (!armed()) return; if (S.walls.length <= 1){ toast('O projeto precisa ter ao menos uma parede.'); return; } S.walls = S.walls.filter(x => x.id !== id); if (S.activeWall === id) S.activeWall = S.walls[0].id; renderWallList(); renderWallForm(); break;
    case 'addOp': { const w = activeWall(); w.openings.push({ id: uid(), type: 'Janela', name: 'J' + String(w.openings.length + 1).padStart(2, '0'), w: 1200, h: 1000, x: Math.min(1000, Math.max(0, w.w - 1200)), y: 1200, margin: 10 }); renderWallForm(); renderWallList(); break; }
    case 'delOp': { const w = activeWall(); w.openings = w.openings.filter(x => x.id !== id); renderWallForm(); renderWallList(); break; }
    case 'materials': openMaterials(); return;
    default: return;
  }

/* =====================================================================
   CÁLCULO E RESULTADOS
   ===================================================================== */
/* Parâmetros efetivos do revestimento: herda ferramenta/serra/CNC/tolerâncias do projeto e usa os próprios de montagem. */
function cladParams(base){
  return Object.assign({}, S.params, S.clad.params, { studs: 0, studsCustom: false, showStuds: false, isClad: true, avoid: base.sel.r });
}
function computeClad(){
  RC = null;
  if (!S.clad.on || !R) return;
  const matC = materials.find(m => m.id === S.clad.materialId) || null;
  const Pc = cladParams(R), Sc = Object.assign({}, S, { params: Pc });
  const errs = validate(Sc, matC).filter(e => !/^Selecione um material/.test(e)).concat(matC ? [] : ['Selecione o material do revestimento.']);
  if (errs.length){ RC = { errors: errs }; return; }
  const t0 = performance.now();
  const res = optimizeAll(Sc, matC, 40, 300);
  UI.calcMsC = performance.now() - t0;
  if (res.error){ RC = { errors: ['Não foi possível paginar o revestimento: ' + res.error + '.'] }; return; }
  RC = Object.assign(res, { mat: matC, P: Pc });
}
function recalc(force){
  const mat = curMat();
  const errs = validate(S, mat);
  if (errs.length){ R = null; RC = null; renderResults(errs); return; }
  const t0 = performance.now();
  const res = optimizeAll(S, mat, 40, 300);
  UI.calcMs = performance.now() - t0;
  if (res.error){ R = null; RC = null; renderResults(['Não foi possível paginar: ' + res.error + '.']); return; }
  R = Object.assign(res, { mat });
  computeClad();
  if (!S.walls.some(w => w.id === UI.wallId)) UI.wallId = S.walls[0].id;
  renderResults();
  if (force) $('#results').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function kpi(k, v, unit, sub, cls){ return `<div class="kpi ${cls || ''}"><div class="k">${k}</div><div class="v">${v}${unit ? `<small>${unit}</small>` : ''}</div><div class="s">${sub || ''}</div></div>`; }
function renderResults(errs){
  const el = $('#results');
  if (errs && errs.length){
    el.innerHTML = `<div class="note err"><b>Corrija os dados para calcular:</b><ul>${errs.map(e => `<li>${esc(e)}</li>`).join('')}</ul></div>`; return;
  }
  let html = resultsBlock(0), cladOk = false;
  if (S.clad.on && RC){
    if (RC.errors) html += `<div class="layer-h"><h2>Revestimento</h2></div><div class="note err"><b>Corrija os dados do revestimento:</b><ul>${RC.errors.map(e => `<li>${esc(e)}</li>`).join('')}</ul></div>`;
    else { cladOk = true; html += `<div class="layer-h"><h2>Revestimento · ${esc(RC.mat.name)}</h2><p class="hint">Sobre a parede de OSB acima — mesmas paredes e aberturas; juntas desencontradas das do OSB e a pelo menos ${mm(RC.P.cornerClear)} mm dos cantos das aberturas.</p></div>` + inLayer(1, () => resultsBlock(1)); }
  }
  el.innerHTML = html;
  renderPane(0); if (cladOk) renderPane(1);
}
/* Bloco completo de resultados (KPIs, quadro de configuração, avisos, abas) da camada ativa. Chamar dentro de inLayer(). */
function resultsBlock(layer){
  const r = R.sel.r, m = r.metrics, warn = [];
  r.entries.forEach(e => e.lay.warnings.forEach(w => warn.push(`${e.wall.name} - ${w}`)));
  // notas de engenharia por material (juntas de dilatação)
  const gaps = [S.params.gapH].concat(S.params.studs > 0 ? [] : [S.params.gapV]);
  if (R.mat.type === 'OSB' && gaps.some(g => g < 3)) warn.push('OSB: use espaçamento de 3 mm entre todas as placas (dilatação por umidade e contraventamento).');
  if (R.mat.type === 'Placa cimentícia' && gaps.some(g => g < 6 || g > 10)) warn.push('Placa cimentícia: use juntas de dilatação de 6 a 10 mm (alta movimentação térmica).');
  const P = S.params;
  const better = R.bestAll && cmpKey(rankResult(R.bestAll.r), rankResult(r)) < 0 ? R.bestAll : null;
  // desencontro entre fiadas realmente obtido (o valor pedido é um MÍNIMO; o resultado pode ser maior)
  const stags = r.entries.map(e => e.lay.minStag).filter(v => isFinite(v)), stagMin = stags.length ? Math.min(...stags) : null;
  const stagLine = P.stagger > 0 && stagMin != null ? `<br>Desencontro entre fiadas obtido: <b>${mm(stagMin)} mm</b> (mínimo pedido: ${mm(P.stagger)} mm${stagMin < P.stagger - 0.5 ? ' — não foi possível atingir nesta parede' : stagMin > P.stagger + 0.5 ? ' — a melhor opção que cumpre o mínimo' : ''}).` : '';
  const layerLine = P.isClad && isFinite(m.minLayer) && P.layerOff > 0 ? `<br>Menor distância entre juntas do revestimento e do OSB: <b>${mm(m.minLayer)} mm</b> (mínimo pedido: ${mm(P.layerOff)} mm${m.minLayer < P.layerOff - 0.5 ? ' — não foi possível atingir nesta parede' : ''}).` : '';
  const why = better ? (better.r.metrics.cornerViol < m.cornerViol ? 'Outra combinação testada cumpre a regra dos cantos das aberturas' : better.r.metrics.layerShort < m.layerShort ? 'Outra combinação testada cumpre o desencontro em relação ao OSB' : better.r.metrics.staggerShort < m.staggerShort ? 'Outra combinação testada cumpre o desencontro mínimo pedido' : 'Outra combinação testada usa menos') : '';
  return `
  <div class="kpis">
    ${kpi('Chapas necessárias', m.nSheets, m.nSheets === 1 ? 'chapa' : 'chapas', `${m.nWholeClean} inteira${m.nWholeClean === 1 ? '' : 's'} sem corte · ${m.nSheets - m.nWholeClean} a cortar`, 'main')}
    ${kpi('Área da parede', fmtNum(m.gross / 1e6, 2), 'm²', m.openArea > 0 ? `a revestir: ${fmtA(m.net)}` : 'sem aberturas')}
    ${kpi('Aproveitamento', fmtNum(m.util, 1), '%', 'área útil ÷ área das chapas')}
    ${kpi('Desperdício', fmtNum(m.wastePct, 1), '%', 'sobra ÷ área das chapas')}
    ${kpi('Área de sobra', fmtNum(m.waste / 1e6, 2), 'm²', `reaproveitável ${fmtA(m.reusableArea)}`)}
    ${kpi('Cortes', m.cuts, m.cuts === 1 ? 'corte' : 'cortes', `${m.nPieces} peça${m.nPieces === 1 ? '' : 's'} a cortar`)}
  </div>
  <div class="note info">Configuração usada: <b>${ORIENT_NAME[r.orient]}</b>, início pela <b>${START_NAME[r.start].toLowerCase()}</b>, chapa ${esc(R.mat.name)} (${matDimsLabel(R.mat)})${P.studs > 0 ? `, montantes a cada ${mm(P.studs)} mm` : ''}.
    ${P.orientation === 'auto' ? ' O modo automático testou as duas orientações e manteve a que usa menos chapas.' : ''}
    ${stagLine}${layerLine}
    ${better ? `<br>${why}: <b>${better.r.metrics.nSheets} chapas</b> (${ORIENT_NAME[better.o].split(' (')[0].toLowerCase()}, início pela ${START_NAME[better.st].toLowerCase()}). <button class="btn ghost sm" data-apply="${better.o}|${better.st}" data-layer="${layer}">Aplicar</button>` : ''}</div>
  ${warn.length ? `<div class="note warn"><ul>${warn.map(w => `<li>${esc(w)}</li>`).join('')}</ul></div>` : ''}
  <div>
    <div class="tabs" role="tablist">${[['wall', 'Vista da parede'], ['plan', 'Plano de corte'], ['list', 'Lista de corte'], ['res', 'Resultados'], ['cmp', 'Comparar']].map(([k, l]) => `<button class="tab ${UI.tab === k ? 'on' : ''}" role="tab" data-tab="${k}" data-layer="${layer}">${l}</button>`).join('')}</div>
    <div class="pane" id="pane${sfx()}"></div>
  </div>
  <div class="hint">Cálculo em ${Math.round(UI.calcMs)} ms · ${R.alts.filter(a => !a.r.error).length} combinações testadas.</div>`;
}
function renderPane(layer){
  inLayer(layer || 0, () => {
    const p = $('#pane' + sfx()); if (!p || !R) return;
    const fn = { wall: paneWall, plan: panePlan, list: paneList, res: paneRes, cmp: paneCmp }[UI.tab];

document.addEventListener('click', e => {

  const tb = e.target.closest('[data-tab]'); if (tb){ const L = layerOf(tb); inLayer(L, () => { UI.tab = tb.dataset.tab; }); tb.parentElement.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t === tb)); renderPane(L); return; }
  const ap = e.target.closest('[data-apply]'); if (ap){

/* ---------- desenhos (SVG) ---------- */
function fsFit(text, fs, w){ return text.length * fs * 0.56 <= w; }
/* Retângulos {x,y,w,h} (coords da parede) que formam uma peça; e a caixa onde vai o texto (maior retângulo). */
function pieceRects(p){ return p.body ? p.body.map(b => ({ x: b.x0, y: b.y0, w: b.x1 - b.x0, h: b.y1 - b.y0 })) : [{ x: p.x, y: p.y, w: p.w, h: p.h }]; }
function biggestRect(rs){ return rs.reduce((a, b) => (b.w * b.h > a.w * a.h ? b : a)); }
function shapeTag(sh){ return sh === 'L' ? 'em L' : sh === 'U' ? 'em U' : sh === 'moldura' ? 'moldura' : sh ? 'c/ recortes' : ''; }
/* renderWall: vista da parede, proporcional às medidas reais */
function renderWall(entry, r, opts){
  opts = opts || {};
  const wall = entry.wall, lay = entry.lay, W = wall.w, H = wall.h;
  const big = Math.max(W, H), mg = big * 0.075, fs = big / 55;
  let s = `<svg class="wallsvg" viewBox="${-mg} ${-mg} ${W + 2 * mg} ${H + 2 * mg}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Paginação da parede ${esc(wall.name)}" ${opts.noStyle ? '' : `style="width:${UI.zoom * 100}%"`} font-family="Barlow,Segoe UI,Arial,sans-serif">
    <defs><pattern id="hatchW" width="${fs * 0.9}" height="${fs * 0.9}" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="${fs * 0.9}" height="${fs * 0.9}" fill="var(--panel)"/><line x1="0" y1="0" x2="0" y2="${fs * 0.9}" stroke="var(--accent)" stroke-width="${fs * 0.1}"/></pattern></defs>
    <rect x="0" y="0" width="${W}" height="${H}" fill="var(--panel)" stroke="var(--ink)" stroke-width="${fs * 0.1}"/>`;
  let texts = '';
  lay.pieces.forEach(p => {
    const rects = pieceRects(p), fill = p.whole ? 'var(--whole)' : 'var(--cut)', lb = biggestRect(rects), tag = shapeTag(p.shape);
    s += `<g><title>Chapa ${p.label}${p.whole ? ' (inteira)' : ' (peça cortada' + (p.shapeDesc ? ' · ' + p.shapeDesc : '') + ')'} · ${mm(p.w)} × ${mm(p.h)} mm</title>`;
    if (p.body){
      rects.forEach(b => { s += `<rect x="${b.x}" y="${H - (b.y + b.h)}" width="${b.w}" height="${b.h}" fill="${fill}" stroke="${fill}" stroke-width="${fs * 0.03}"/>`; });
      s += `<path d="${mergeCutSegs(unionOutline(rects), 0.01).map(c => `M${c.x1} ${H - c.y1}L${c.x2} ${H - c.y2}`).join('')}" fill="none" stroke="var(--ink)" stroke-width="${fs * 0.07}"/>`;
    } else s += `<rect x="${p.x}" y="${H - (p.y + p.h)}" width="${p.w}" height="${p.h}" fill="${fill}" stroke="var(--ink)" stroke-width="${fs * 0.07}"/>`;
    s += '</g>';
    const cx = lb.x + lb.w / 2, cy = H - (lb.y + lb.h) + lb.h / 2, l1 = 'Chapa ' + p.label, l2 = mm(p.w) + ' × ' + mm(p.h), l3 = p.whole ? 'inteira' : (tag ? 'cortada ' + tag : 'cortada');
    if (lb.w > fs * 2 && lb.h > fs * 1.4){
      const small = !fsFit(l1, fs, lb.w) ? fs * 0.7 : fs;
      texts += `<text x="${cx}" y="${cy - (lb.h > fs * 4 ? fs * 0.7 : 0)}" text-anchor="middle" dominant-baseline="middle" font-size="${small}" font-weight="700" fill="var(--ink)" stroke="var(--panel)" stroke-width="${fs * 0.02}">${l1.replace('Chapa ', lb.w < fs * 5 ? '' : 'Chapa ')}</text>`;
      if (lb.h > fs * 4 && lb.w > fs * 4) texts += `<text x="${cx}" y="${cy + fs * 0.6}" text-anchor="middle" dominant-baseline="middle" font-size="${fsFit(l2, fs * 0.85, lb.w) ? fs * 0.85 : fs * 0.6}" fill="var(--ink)">${l2}</text>`;
      if (lb.h > fs * 6 && lb.w > fs * 4) texts += `<text x="${cx}" y="${cy + fs * 1.7}" text-anchor="middle" dominant-baseline="middle" font-size="${fs * 0.7}" fill="var(--ink)" opacity=".75">${l3}</text>`;
    }
  });
  if (S.params.showStuds && S.params.studs > 0 && !opts.noStuds){
    studAxes(W, S.params.studs, r.start).forEach(x => { s += `<line x1="${x}" y1="0" x2="${x}" y2="${H}" stroke="var(--stud)" stroke-width="${fs * 0.1}" stroke-dasharray="${fs * 0.5} ${fs * 0.4}" opacity=".7"/>`; });
  }
  s += texts;
  if (S.params.isClad){   // juntas do OSB (referência): o revestimento não pode alinhar com elas
    const av = avoidFor(S.params, wall.id);
    if (av){
      av.v.forEach(o => { s += `<line x1="${o.x}" y1="${H - o.y0}" x2="${o.x}" y2="${H - o.y1}" stroke="var(--warn)" stroke-width="${fs * 0.14}" stroke-dasharray="${fs * 0.9} ${fs * 0.5}" opacity=".95"/>`; });
      av.h.forEach(y => { s += `<line x1="0" y1="${H - y}" x2="${W}" y2="${H - y}" stroke="var(--warn)" stroke-width="${fs * 0.14}" stroke-dasharray="${fs * 0.9} ${fs * 0.5}" opacity=".95"/>`; });
    }
  }
  wall.openings.forEach(o => {
    const y = H - (o.y + o.h);
    s += `<g><title>${esc(o.name)} (vão osso ${mm(o.w)} × ${mm(o.h)} mm)${o.margin > 0 ? ' · recuo das chapas: ' + mm(o.margin) + ' mm' : ''}</title>
      <rect x="${o.x}" y="${y}" width="${o.w}" height="${o.h}" fill="url(#hatchW)" stroke="var(--accent)" stroke-width="${fs * 0.14}" stroke-dasharray="${fs * 0.6} ${fs * 0.3}"/></g>
      <text x="${o.x + o.w / 2}" y="${y + o.h / 2 - fs * 0.5}" text-anchor="middle" font-size="${fs * 0.95}" font-weight="700" fill="var(--accent)" stroke="var(--panel)" stroke-width="${fs * 0.3}" paint-order="stroke">${esc(o.name)}</text>
      <text x="${o.x + o.w / 2}" y="${y + o.h / 2 + fs * 0.7}" text-anchor="middle" font-size="${fs * 0.8}" fill="var(--accent)" stroke="var(--panel)" stroke-width="${fs * 0.3}" paint-order="stroke">${mm(o.w)} × ${mm(o.h)}</text>`;
  });
  // cotas gerais
  const dy = -mg * 0.45, dx = -mg * 0.45;
  s += `<g stroke="var(--muted)" stroke-width="${fs * 0.08}" fill="var(--muted)">
    <line x1="0" y1="${dy}" x2="${W}" y2="${dy}"/><line x1="0" y1="${dy - fs * 0.5}" x2="0" y2="${dy + fs * 0.5}"/><line x1="${W}" y1="${dy - fs * 0.5}" x2="${W}" y2="${dy + fs * 0.5}"/>
    <line x1="${dx}" y1="0" x2="${dx}" y2="${H}"/><line x1="${dx - fs * 0.5}" y1="0" x2="${dx + fs * 0.5}" y2="0"/><line x1="${dx - fs * 0.5}" y1="${H}" x2="${dx + fs * 0.5}" y2="${H}"/>
    <text x="${W / 2}" y="${dy - fs * 0.6}" text-anchor="middle" font-size="${fs * 1.1}" stroke="none">${fmtLen(W)}</text>
    <text transform="translate(${dx - fs * 0.7} ${H / 2}) rotate(-90)" text-anchor="middle" font-size="${fs * 1.1}" stroke="none">${fmtLen(H)}</text></g></svg>`;
  return s;
}
/* renderSheetCuttingPlan: plano de corte de uma chapa */
function sheetAxes(r){
  // A chapa sempre senta na mesa com a MENOR medida no eixo X e a MAIOR no eixo Y — é uma
  // característica física da chapa sobre a mesa da máquina, e não tem relação com a orientação de
  // instalação na parede (em pé/deitada), que só decide como as peças são encaixadas dentro da chapa.
  const T = r.sw > r.sh;      // true = o encaixe usou a chapa "deitada" (sw é a maior medida)
  const W = T ? r.sh : r.sw;  // extensão no eixo X do desenho / da máquina (a menor medida da chapa)
  const H = T ? r.sw : r.sh;  // extensão no eixo Y do desenho / da máquina (a maior medida da chapa)
  // Coordenadas da MÁQUINA (as que vão para o G-code): direto, sem inverter — o canto (0,0) do
  // encaixe é o mesmo canto (0,0) da máquina, sem nenhuma transformação além da troca de eixo quando
  // a chapa está deitada. É ESSENCIAL não inverter aqui: o valor gravado no arquivo precisa
  // corresponder exatamente ao canto onde a chapa é zerada na mesa.
  const mpt = (x, y) => T ? [y, x] : [x, y];
  // Coordenadas de TELA (só para o desenho SVG/PDF): mesmo X, Y invertido para o desenho ficar com
  // "0" embaixo (convenção visual, Y crescendo para cima) — essa inversão NUNCA deve ser usada para
  // gerar o G-code, só para posicionar os elementos no desenho.
  const spt = (x, y) => { const [mx, my] = mpt(x, y); return [mx, H - my]; };
  const srect = (x, y, w, h) => { const [mx, my] = mpt(x, y); const mw = T ? h : w, mh = T ? w : h; return { x: mx, y: H - my - mh, w: mw, h: mh }; };
  const mdim = (w, h) => T ? [h, w] : [w, h];   // largura/altura de uma peça, já na convenção da máquina
  return { T, W, H, mpt, spt, srect, mdim };
}
function renderSheetCuttingPlan(sheet, r){
  const { W, H, spt, srect } = sheetAxes(r);
  const big = Math.max(W, H), fs = big / 46, mg = fs * 0.5;
  const uid2 = 'h' + sheet.no;
  // Y é invertido no desenho (0 embaixo, igual à vista da parede) para bater com o programa de usinagem:
  // o canto inferior esquerdo do desenho é X0 Y0 do arquivo CNC.
  let s = `<svg class="sheetsvg" viewBox="${-mg} ${-mg} ${W + 2 * mg} ${H + 2 * mg}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Plano de corte da chapa ${sheet.no}" font-family="Barlow,Segoe UI,Arial,sans-serif">
    <defs><pattern id="${uid2}" width="${fs * 0.8}" height="${fs * 0.8}" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="${fs * 0.8}" height="${fs * 0.8}" fill="var(--resid)"/><line x1="0" y1="0" x2="0" y2="${fs * 0.8}" stroke="var(--muted)" stroke-width="${fs * 0.08}" opacity=".6"/></pattern></defs>
    <rect x="0" y="0" width="${W}" height="${H}" fill="url(#${uid2})" stroke="var(--ink)" stroke-width="${fs * 0.12}"/>`;
  sheet.free.forEach(f => {
    const d = srect(f.x, f.y, f.w, f.h), l = `${mm(d.w)} × ${mm(d.h)}`;
    s += `<rect x="${d.x}" y="${d.y}" width="${d.w}" height="${d.h}" fill="${f.reusable ? 'var(--remn)' : 'var(--resid)'}" stroke="var(--ink)" stroke-width="${fs * 0.05}" stroke-dasharray="${fs * 0.3} ${fs * 0.3}"/>`;
    if (d.w > fs * 3 && d.h > fs * 2.2) s += `<text x="${d.x + d.w / 2}" y="${d.y + d.h / 2 - fs * 0.4}" text-anchor="middle" dominant-baseline="middle" font-size="${fs * 0.85}" font-weight="600" fill="var(--ink)">${f.reusable ? 'Sobra' : 'Resíduo'}</text><text x="${d.x + d.w / 2}" y="${d.y + d.h / 2 + fs * 0.7}" text-anchor="middle" dominant-baseline="middle" font-size="${fsFit(l, fs * 0.8, d.w) ? fs * 0.8 : fs * 0.55}" fill="var(--ink)">${l}</text>`;
  });
  sheet.placed.forEach(pl => {
    const p = pl.piece, whole = sheet.kind === 'whole' && !sheet.trimmed, dbb = srect(pl.x, pl.y, pl.w, pl.h), l2 = `${mm(dbb.w)} × ${mm(dbb.h)}`;
    const body = plBody(pl), fill = whole ? 'var(--whole)' : 'var(--cut)', tag = shapeTag(p.shape);
    if (pl.body){
      body.forEach(b => { const q = srect(b.x, b.y, b.w, b.h); s += `<rect x="${q.x}" y="${q.y}" width="${q.w}" height="${q.h}" fill="${fill}" stroke="${fill}" stroke-width="${fs * 0.03}"/>`; });
      s += `<path d="${mergeCutSegs(unionOutline(body), 0.01).map(c => { const [x1, y1] = spt(c.x1, c.y1), [x2, y2] = spt(c.x2, c.y2); return `M${x1} ${y1}L${x2} ${y2}`; }).join('')}" fill="none" stroke="var(--ink)" stroke-width="${fs * 0.08}"/>`;
    } else s += `<rect x="${dbb.x}" y="${dbb.y}" width="${dbb.w}" height="${dbb.h}" fill="${fill}" stroke="var(--ink)" stroke-width="${fs * 0.08}"/>`;
    const lbn = biggestRect(body), d = srect(lbn.x, lbn.y, lbn.w, lbn.h);
    if (d.w > fs * 3 && d.h > fs * 2.2){
      const cx = d.x + d.w / 2, cy = d.y + d.h / 2;
      s += `<text x="${cx}" y="${cy - fs * 0.9}" text-anchor="middle" dominant-baseline="middle" font-size="${fs * 0.95}" font-weight="700" fill="var(--ink)">${whole ? 'Chapa inteira' : esc(p.label)}</text>
        <text x="${cx}" y="${cy + fs * 0.1}" text-anchor="middle" dominant-baseline="middle" font-size="${fsFit(l2, fs * 0.9, d.w) ? fs * 0.9 : fs * 0.6}" fill="var(--ink)">${l2}${pl.rot ? ' ↻' : ''}${tag ? ' · ' + tag : ''}</text>
        <text x="${cx}" y="${cy + fs * 1.1}" text-anchor="middle" dominant-baseline="middle" font-size="${fs * 0.75}" fill="var(--ink)" opacity=".8">${esc(p.wallName)}</text>`;
    }
  });
  sheet.cutLines.forEach(c => { const [x1, y1] = spt(c.x1, c.y1), [x2, y2] = spt(c.x2, c.y2); s += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--danger)" stroke-width="${fs * 0.14}" stroke-dasharray="${fs * 0.7} ${fs * 0.4}"/>`; });
  s += `<circle cx="0" cy="${H}" r="${fs * 0.35}" fill="var(--accent)"/><text x="${fs * 0.6}" y="${H - fs * 0.6}" font-size="${fs * 0.8}" font-weight="700" fill="var(--accent)">X0 Y0</text>`;
  return s + '</svg>';
}
function legend(){ return `<div class="legend"><span><i style="background:var(--whole)"></i>Chapa inteira</span><span><i style="background:var(--cut)"></i>Peça cortada</span><span><i style="background:var(--remn)"></i>Sobra reaproveitável</span><span><i style="background:var(--resid)"></i>Resíduo</span><span><i style="background:var(--panel);border-style:dashed;border-color:var(--accent)"></i>Abertura</span>${S.params.studs > 0 ? '<span><i style="border:0;border-left:2px dashed var(--stud);width:2px;height:14px"></i>Montante</span>' : ''}${S.params.isClad ? '<span><i style="border:0;border-left:2px dashed var(--warn);width:2px;height:14px"></i>Junta do OSB (referência)</span>' : ''}</div>`; }

  }

document.addEventListener('click', e => {

});

/* =====================================================================
   NUVEM: SENHA ÚNICA + PERSISTÊNCIA VIA GOOGLE APPS SCRIPT
   -----------------------------------------------------------------------
   Sem servidor próprio e sem OAuth do Google: a "nuvem" aqui é um Web App
   do Google Apps Script, publicado a partir da própria Google Planilha,
   que lê e grava as linhas da planilha e devolve JSON (ver "Code.gs" no
   guia). O Apps Script roda com a conta Google de quem o publicou --
   quem usa o app aqui não precisa ter conta Google nem ser convidado na
   planilha.
   A segurança real está no Apps Script, não neste arquivo: toda chamada
   leva a senha digitada, e o script (código que só quem o publicou vê,
   fora do GitHub) recusa qualquer chamada cuja senha não bata com a que
   foi configurada nele. A tela de senha aqui é a praticidade do dia a
   dia -- quem pular essa tela pelo DevTools do navegador ainda não
   consegue ler nem gravar nada, porque o Apps Script confere a senha de
   novo, do lado dele, em cada chamada.
   Enquanto a URL do Apps Script não for configurada (painel "⚙ Login e
   nuvem"), o app continua funcionando 100% local, exatamente como antes
   -- a nuvem é opcional e não quebra o uso sem login.
   ===================================================================== */
function getGCfg(){ return lsGet('gcfg', { scriptUrl: '', userName: '' }); }
function setGCfg(c){ lsSet('gcfg', c); }
const CLOUD = { authed: false, secret: null };
function cloudConfigured(){ const c = getGCfg(); return !!c.scriptUrl; }
function cloudSignedIn(){ return CLOUD.authed; }

/* ---------- chamada ao Web App do Apps Script (fetch direto, sem lib) ---------- */
async function scriptApi(action, extra){
  const c = getGCfg();
  if (!c.scriptUrl) throw new Error('URL do Apps Script não configurada.');
  const body = Object.assign({ action, secret: CLOUD.secret || '' }, extra || {});
  const res = await fetch(c.scriptUrl, {
    method: 'POST',
    // text/plain evita o pré-voo (preflight) de CORS que o Apps Script não trata bem com
    // application/json; o próprio Code.gs faz JSON.parse do corpo recebido.
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error('Apps Script HTTP ' + res.status);
  const data = await res.json();
  if (data && data.error){ const err = new Error(data.error); err.code = data.error; throw err; }
  return data;
}

/* ---------- CRUD de projetos na planilha (via Apps Script) ----------
   colunas: A id | B name | C updated (epoch ms) | D updatedBy | E data (JSON do projeto) */
async function cloudListProjects(){
  const data = await scriptApi('list');
  const rows = (data && data.rows) || [];
  return rows.filter(r => r[0]).map(r => {
    let snap; try { snap = JSON.parse(r[4] || '{}'); } catch (e){ snap = {}; }
    snap.id = r[0]; snap.name = r[1] || snap.name || 'Sem nome'; snap.updated = Number(r[2]) || 0; snap.updatedBy = r[3] || '';
    return snap;
  });
}
async function cloudSaveProject(snap){
  const c = getGCfg();
  const row = [snap.id, snap.name, String(snap.updated), c.userName || '', JSON.stringify(snap)];
  await scriptApi('save', { row });
}
async function cloudDeleteProject(id){
  await scriptApi('delete', { id });
}
async function cloudDuplicateProject(id){
  const list = await cloudListProjects(); const p = list.find(x => x.id === id); if (!p) return;
  const c = JSON.parse(JSON.stringify(p)); c.id = uid(); c.name = p.name + ' (cópia)'; c.updated = Date.now();
  c.walls.forEach(w => { w.id = uid(); w.openings.forEach(o => o.id = uid()); }); c.activeWall = c.walls[0].id;
  await cloudSaveProject(c);
}

/* ---------- tela de login (gate) e indicador no cabeçalho ---------- */
function updateCloudChip(){
  const chip = $('#cloudChip'); if (!chip) return;
  const dot = $('#cloudDot'), label = $('#cloudLabel');
  if (cloudConfigured() && cloudSignedIn()){ chip.style.display = ''; dot.className = 'cloud-dot'; label.textContent = 'conectado'; }
  else if (cloudConfigured()){ chip.style.display = ''; dot.className = 'cloud-dot off'; label.textContent = 'desconectado'; }
  else chip.style.display = 'none';
}
function showLoginGate(msgHtml){
  const gate = $('#loginGate'); if (!gate) return;
  gate.classList.remove('hidden');
  $('#loginMsg').innerHTML = msgHtml || '';
  bindLoginBtn();
  const pass = $('#loginPass'); if (pass){ pass.value = ''; pass.focus(); }
  const link = $('#gCfgLink');
  if (link && !link._bound){ link._bound = true; link.addEventListener('click', e => { e.preventDefault(); hideLoginGate(); openCloudCfg(); }); }
}
function hideLoginGate(){ const gate = $('#loginGate'); if (gate) gate.classList.add('hidden'); }
function bindLoginBtn(){
  const b = $('#loginBtn');
  if (b && !b._bound){ b._bound = true; b.addEventListener('click', cloudSignIn); }
  const pass = $('#loginPass');
  if (pass && !pass._bound){ pass._bound = true; pass.addEventListener('keydown', e => { if (e.key === 'Enter') cloudSignIn(); }); }
}
async function cloudSignIn(){
  const btn = $('#loginBtn'), pass = $('#loginPass');
  const typed = pass ? pass.value : '';
  if (!typed){ showLoginGate('<p style="color:var(--danger)">Digite a senha.</p>'); return; }
  if (btn){ btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Entrando…'; }
  try {
    CLOUD.secret = typed;
    await scriptApi('list'); // valida a senha no próprio Apps Script (servidor), não só aqui
    CLOUD.authed = true;
    hideLoginGate(); updateCloudChip(); toast('Conectado.');
    if ($('#modalRoot').innerHTML) closeModal();
  } catch (e){
    CLOUD.authed = false; CLOUD.secret = null;
    const wrong = e.code === 'unauthorized';
    showLoginGate('<p style="color:var(--danger)">' + (wrong ? 'Senha incorreta.' : 'Não foi possível conectar (' + esc(e.message) + '). Confira a URL do Apps Script em "Configurar acesso".') + '</p>');
  } finally {
    if (btn){ btn.disabled = false; btn.textContent = 'Entrar'; }
  }
}
function cloudSignOut(){
  CLOUD.authed = false; CLOUD.secret = null;
  updateCloudChip(); toast('Sessão encerrada.');
  if (cloudConfigured()) showLoginGate();
}

/* ---------- painel de configuração (URL do Apps Script) ---------- */

  const c = getGCfg();

    <div class="cfg-field f"><span>URL do Apps Script (Web App)</span><div class="inp"><input id="cfgScriptUrl" value="${esc(c.scriptUrl)}" placeholder="https://script.google.com/macros/s/.../exec"></div></div>
    <div class="cfg-field f"><span>Seu nome (aparece como quem salvou, opcional)</span><div class="inp"><input id="cfgUserName" value="${esc(c.userName || '')}" placeholder="ex.: Carlos"></div></div>
    <p class="hint">Status: ${cloudSignedIn() ? 'conectado' : (cloudConfigured() ? 'configurado, não conectado' : 'nuvem desativada (uso local)')}</p>

}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-cc]'); if (!b) return;
  switch (b.dataset.cc){
    case 'close': closeModal(); break;
    case 'save': {
